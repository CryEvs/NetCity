	
<form class="form-horizontal" ng-show="viewReady">
	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">Страна</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<select class="form-control"
					ng-options="country.name for country in data.countries track by country.id"
					ng-change="updatefilter(data.country, 'country')"
					ng-model="data.country"></select>
		</div>
	</div>
	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">Регион</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<select class="form-control"
					ng-options="state.name for state in data.states track by state.id"
					ng-model="data.state"></select>
		</div>
	</div>
	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">Муниципальный район</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<select class="form-control"
					ng-options="province.name for province in data.provinces track by province.id"
					ng-change="updatefilter(data.province, 'province')"
					ng-model="data.province"></select>
		</div>
	</div>
	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">Населенный пункт</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<select class="form-control"
					ng-options="city.name for city in data.cities track by city.id"
					ng-model="data.city"></select>
		</div>
	</div>
	<div class="form-group" ng-show="data.city != null">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">Образовательные организации/<br/>структурные подразделения</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<div class="btn-group" style="padding-bottom: 15px">
				<div class="btn-group" role="group">
					<button type="button" class="btn btn-default dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
						<span class="glyphicon glyphicon-plus-sign"></span>
						Добавить
						<span class="caret"></span>
					</button>
					<ul class="dropdown-menu">
						<li><a href="#" ng-click="add()"><span class="glyphicon glyphicon-education"></span> Добавить новую образовательную организацию</a></li>
						<li><a href="#" ng-click="import()"><span class="glyphicon glyphicon-import"></span> Импорт образовательных организаций</a></li>
					</ul>
				</div>
				<button title="Сведения об ОО" ng-hide="data.school == null" ng-click="edit(data.school)" type="button" class="btn btn-info">
					<span class="glyphicon glyphicon-info-sign"></span>
					<span>Сведения об ОО</span>
				</button>
				<button title="Администрирование ОО" ng-hide="data.school == null" ng-click="admin(data.school)" type="button" class="btn btn-warning">
					<span class="glyphicon glyphicon-wrench"></span>
					<span>Администрирование ОО</span>
				</button>
				<button title="Удалить" ng-hide="data.school == null" ng-click="delete(data.school)" type="button" class="btn btn-danger">
					<span class="glyphicon glyphicon-trash"></span>
					<span>Удалить</span>
				</button>
			</div>
			<select class="form-control" size="12" ng-options="school.name for school in data.schools track by school.id" ng-model="data.school"></select>
		</div>
	</div>
</form>
<span class="content-page-preloader" id="preloader" ng-hide="viewReady"><span>{{language.Generic.Movement.kPleaseWait}}</span></span>
