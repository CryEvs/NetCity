<div class="form-horizontal" ng-if="$ctrl.state.ready">		
	<div class="row">
        <div class="col-md-12">
            <div class="buttons-panel">
                <button title="{{$ctrl.language.Generic.ServAdmin.kSaveMovePeriodPermission}}" type="button" class="btn btn-primary" ng-click="$ctrl.save()">
                    <span class="glyphicon glyphicon-floppy-save"></span> <span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
				</button>
				
				<button title="{{$ctrl.language.Generic.ServAdmin.kEditMovePeriodsInfo}}" type="button" class="btn btn-warning" ng-click="$ctrl.edit()">
					<span class="glyphicon glyphicon-pencil"></span> <span>{{$ctrl.language.Generic.Buttons.kEdit}}</span>
				</button>
            </div>
        </div>
    </div>

	<div class="row">
		<div class="col-md-7">
			<div class="form-group">
				<label class="control-label col-md-4 col-lg-3 col-sm-4">{{$ctrl.language.Generic.Common.kSchoolYear}}</label>
				<div class="col-md-8 col-lg-9 col-sm-8">
					<select class="form-control" ng-init="ctrl.data.globalYear" ng-options="globalYear.name for globalYear in $ctrl.data.globalYears track by globalYear.id"
							ng-change="$ctrl.updateMovePeriodsPermits()" ng-model="$ctrl.data.globalYear"></select>
				</div>
			</div>
		</div>
	</div>

	<div class="row">
		<div class="col-lg-8">
			<table class="table table-bordered table-condensed">
				<tr>
					<th>{{$ctrl.language.Generic.ServAdmin.kPeriodName}}</th>
					<th>{{$ctrl.language.Generic.ServAdmin.kPeriodScope}}</th>
					<th ng-bind-html="$ctrl.language.Generic.ServAdmin.kPeriodPermission"></th>
				</tr>
				<tr ng-repeat="movePeriodPermit in $ctrl.data.movePeriodsPermits">
					<th>{{movePeriodPermit.periodName}}</th>
					<td ng-class="{ 'bg-success': movePeriodPermit.permitted }">
						<span ng-if="movePeriodPermit.startDate && movePeriodPermit.endDate">
							{{movePeriodPermit.startDate | date: "longDate"}} - {{movePeriodPermit.endDate | date: "longDate"}}
						</span>
					</td>
					<td class="text-center" ng-class="{ 'bg-success': movePeriodPermit.permitted }">
						<input name="permitted" type="radio" ng-checked="movePeriodPermit.permitted" ng-click="$ctrl.permit(movePeriodPermit)" track-changes>
					</td>
				</tr>
			</table>
		</div>
	</div>
</div>
