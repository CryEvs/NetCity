<div class="row">
	<div class="col-md-12">
		<div class="buttons-panel">
			<button title="{{$ctrl.language.Generic.Common.kSave}}" type="button" class="btn btn-primary" ng-click="$ctrl.save()">
				<span class="glyphicon glyphicon-floppy-save"></span> <span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
			</button>
		</div>
	</div>
</div>
<hr>

<div class="form-horizontal" ng-if="$ctrl.state.ready">
	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kVideoConfApiUrl}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<input type="text" class="form-control" ng-model="$ctrl.data.videoConfSettings.videoConfApiUrl" size="400" maxlength="400" track-changes>
		</div>
	</div>
	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kOrgVideoConfApiUrl}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<button title="{{$ctrl.language.Generic.Common.kTune}}" type="button" class="btn btn-default" ng-click="$ctrl.tune()">
				<span class="glyphicon glyphicon glyphicon-wrench"></span> <span>{{$ctrl.language.Generic.Buttons.kTune}}</span>
			</button>
		</div>
	</div>
</div>
