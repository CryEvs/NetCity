<div class="row ns-cloak">
	<div class="col-md-12">
		<div class="buttons-panel buttons-panel-left">
			<button title="{{$ctrl.language.Generic.ServAdmin.kAddOrgVideoConfSetting}}" type="button" class="btn btn-info" ng-click="$ctrl.addVideoConfSetting()">
				<span class="glyphicon glyphicon-plus-sign"></span>
				<span>{{$ctrl.language.Generic.Buttons.kAdd}}</span>
			</button>

			<button ng-disabled="!$ctrl.selection.selected" title="{{$ctrl.language.Generic.ServAdmin.kEditOrgVideoConfSetting}}" type="button" class="btn btn-info" ng-click="$ctrl.editVideoConfSetting()">
				<span class="glyphicon glyphicon-pencil"></span>
				<span>{{$ctrl.language.Generic.Buttons.kEdit}}</span>
			</button>

			<button ng-disabled="!$ctrl.selection.selected" title="{{$ctrl.language.Generic.ServAdmin.kDelOrgVideoConfSetting}}" type="button" class="btn btn-warning" ng-click="$ctrl.deleteVideoConfSetting()">
				<span class="glyphicon glyphicon-remove"></span>
				<span>{{$ctrl.language.Generic.Buttons.kRemove}}</span>
			</button>
		</div>
	</div>
</div>

<div class="row ns-cloak">

	<div class="col-md-12">

		<div ng-if="!$ctrl.orgVideoConfSettings.length" class="alert alert-info" role="alert">
			{{$ctrl.language.Generic.ServAdmin.kNoOrgVideoConfSettings}}
		</div>

		<form class="form-sm" ng-if="$ctrl.orgVideoConfSettings.length">
			<table class="table table-thin table-xs table-bright table-bright-hover table-selectable print-block">
				<tr>
					<th>{{$ctrl.language.Generic.EM.kManagement}}</th>
					<th>{{$ctrl.language.Generic.Common.kOrganization}}</th>
					<th>{{$ctrl.language.Generic.Curriculum.kLinkURL}}</th>
				</tr>
				<tr ng-repeat="setting in $ctrl.orgVideoConfSettings" ng-class="{'selected': $ctrl.selection.isSelected(setting)}" ng-click="$ctrl.selection.select(setting)">
					<td>{{setting.founderName}}</td>
					<td>{{setting.school.name}}</td>
					<td>{{setting.vcGateUrl}}</td>
				</tr>
			</table>
		</form>

	</div>
</div>
