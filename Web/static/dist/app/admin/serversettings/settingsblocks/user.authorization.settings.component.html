<div class="row" ng-if="$ctrl.state.ready">
	<div class="col-md-12">
		<div class="row">
			<div class="col-md-12">
				<div class="buttons-panel">
					<button title="{{$ctrl.language.Generic.Common.kSave}}" type="button" class="btn btn-primary" ng-click="$ctrl.save()">
						<span class="glyphicon glyphicon-floppy-save"></span> <span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
					</button>
				</div>
			</div>
		</div>
	</div>
</div>
<hr>

<form class="form-horizontal" name="$ctrl.form" ng-if="$ctrl.state.ready">
	<div class="row">
		<div class="col-md-12">
			<div class="radio-list-block">
				<div class="radio-list-title">
					<label>{{$ctrl.language.Generic.ServAdmin.kEsiaAuth}}</label>
				</div>
				<div class="radio-list-items-block">
					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" name="EsiaAuth" ng-model="$ctrl.data.userAuthorizationSettings.esiaAuth" ng-value="true" track-changes>{{$ctrl.language.Generic.Common.kYes}}
						</label>
					</div>

					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" name="EsiaAuth" ng-model="$ctrl.data.userAuthorizationSettings.esiaAuth" ng-value="false" track-changes>{{$ctrl.language.Generic.Common.kNo}}
						</label>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div style="padding-bottom:15px;">
		<label>{{$ctrl.language.Generic.ServAdmin.kEsiaAuthProtocol}}</label>
		<div style="padding-left:20px;">
			<div class="radio">
				<label>
					<input type="radio" ng-model="$ctrl.currAuthProvider" ng-value="$ctrl.authProviders.esiaSaml" ng-change="$ctrl.changeProvider()">{{$ctrl.language.Generic.ServAdmin.kSaml}}
				</label>
			</div>
			<div class="radio">
				<label>
					<input type="radio" ng-model="$ctrl.currAuthProvider" ng-value="$ctrl.authProviders.esiaOAuth" ng-change="$ctrl.changeProvider()">{{$ctrl.language.Generic.ServAdmin.kOAuth}}
				</label>
			</div>
			<div class="radio">
				<label>
					<input type="radio" ng-model="$ctrl.currAuthProvider" ng-value="$ctrl.authProviders.esiaIrtechIdentity" ng-change="$ctrl.changeProvider()">{{$ctrl.language.Generic.ServAdmin.kEsiaIrtechIdentityAuth}}
				</label>
			</div>
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kEsiaOAuthServerUrl}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<input type="text" class="form-control" name="EsiaOAuthServerUrl" size="400" maxlength="400" ng-model="$ctrl.data.userAuthorizationSettings.esiaOAuthServerUrl" track-changes ng-disabled="!$ctrl.canEditOAuthSettings()">
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kEsiaOAuthICMnemonics}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<input type="text" class="form-control" name="EsiaOAuthICMnemonics" size="400" maxlength="400" ng-model="$ctrl.data.userAuthorizationSettings.esiaOAuthICMnemonics" track-changes ng-disabled="!$ctrl.canEditOAuthSettings()">
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kEsiaOAuthCertificatePass}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<input type="text" class="form-control" name="EsiaOAuthCertificatePass" size="400" maxlength="400" ng-model="$ctrl.data.userAuthorizationSettings.esiaOAuthCertificatePass" track-changes ng-disabled="!$ctrl.canEditOAuthSettings()">
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kEsiaLoginPage}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<input type="text" class="form-control" name="EsiaLoginPage" size="400" maxlength="400" ng-model="$ctrl.data.userAuthorizationSettings.esiaLoginPage" track-changes ng-disabled="!$ctrl.data.userAuthorizationSettings.esiaSaml">
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kEsiaLogoutUserPage}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<input type="text" class="form-control" name="EsiaLogoutUserPage" size="400" maxlength="400" ng-model="$ctrl.data.userAuthorizationSettings.esiaLogoutUserPage" track-changes ng-disabled="!$ctrl.data.userAuthorizationSettings.esiaSaml">
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kEsiaLinkUserPage}}
		</label><div class="col-md-8 col-lg-5 col-sm-8">
			<input type="text" class="form-control" name="EsiaLinkUserPage" size="400" maxlength="400" ng-model="$ctrl.data.userAuthorizationSettings.esiaLinkUserPage" track-changes ng-disabled="!$ctrl.data.userAuthorizationSettings.esiaSaml">
		</div>
	</div>

	<div class="row">
		<div class="col-md-12">
			<div class="radio-list-block">
				<div class="radio-list-title">
					<label ng-if="$ctrl.soloIntegration">{{$ctrl.language.Generic.ServAdmin.kSoloIrtechAuth}}</label>
					<label ng-if="!$ctrl.soloIntegration">{{$ctrl.language.Generic.ServAdmin.kIrtechAuth}}</label>
				</div>
				
				<div class="radio-list-items-block">
					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" ng-model="$ctrl.data.userAuthorizationSettings.irtechAuth" ng-value="true" track-changes>{{$ctrl.language.Generic.Common.kYes}}
						</label>
					</div>

					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" ng-model="$ctrl.data.userAuthorizationSettings.irtechAuth" ng-value="false" track-changes>{{$ctrl.language.Generic.Common.kNo}}
						</label>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="row">
		<div class="col-md-12">
			<div class="radio-list-block">
				<div class="radio-list-title">
					<label>{{$ctrl.language.Generic.ServAdmin.kEsiaButtonAuth}}</label>
				</div>
				
				<div class="radio-list-items-block">
					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" ng-model="$ctrl.data.userAuthorizationSettings.esiaButtonAuth" ng-value="true" track-changes>{{$ctrl.language.Generic.Common.kYes}}
						</label>
					</div>
					
					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" ng-model="$ctrl.data.userAuthorizationSettings.esiaButtonAuth" ng-value="false" track-changes>{{$ctrl.language.Generic.Common.kNo}}
						</label>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="row">
		<div class="col-md-12">
			<div class="radio-list-block">
				<div class="radio-list-title">
					<label>{{$ctrl.language.Generic.ServAdmin.kEsiaMainAuth}}</label>
				</div>
				
				<div class="radio-list-items-block">
					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" ng-model="$ctrl.data.userAuthorizationSettings.esiaMainAuth" ng-value="true" track-changes>{{$ctrl.language.Generic.Common.kYes}}
						</label>
					</div>

					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" ng-model="$ctrl.data.userAuthorizationSettings.esiaMainAuth" ng-value="false" track-changes>{{$ctrl.language.Generic.Common.kNo}}
						</label>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="row">
		<div class="col-md-12">
			<div class="radio-list-block">
				<div class="radio-list-title">
					<label>{{$ctrl.language.Generic.ServAdmin.kWindowsAuth}}</label>
				</div>
				
				<div class="radio-list-items-block">
					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" name="WindowsAuth" ng-model="$ctrl.data.userAuthorizationSettings.windowsAuth" ng-value="true" track-changes>{{$ctrl.language.Generic.Common.kYes}}
						</label>
					</div>

					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" ng-model="$ctrl.data.userAuthorizationSettings.windowsAuth" ng-value="false" track-changes>{{$ctrl.language.Generic.Common.kNo}}
						</label>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div class="row">
		<div class="col-md-12">
			<div class="radio-list-block">
				<div class="radio-list-title">
					<label>{{$ctrl.language.Generic.ServAdmin.kBlockEsiaUserLogin}}</label>
				</div>
				
				<div class="radio-list-items-block">
					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" ng-model="$ctrl.data.userAuthorizationSettings.blockEsiaUserLogin" ng-value="true" track-changes>{{$ctrl.language.Generic.Common.kYes}}
						</label>
					</div>

					<div class="radio-list-item">
						<label class="radio-inline">
							<input type="radio" ng-model="$ctrl.data.userAuthorizationSettings.blockEsiaUserLogin" ng-value="false" track-changes>{{$ctrl.language.Generic.Common.kNo}}
						</label>
					</div>
				</div>
			</div>
		</div>
	</div>

	<div style="padding-bottom:15px;">
		<label>{{$ctrl.language.Generic.ServAdmin.kRequireEsiaAdminLogin}}</label>
		<div style="padding-left:20px;">
			<div class="radio">
				<label>
					<input type="radio" ng-model="$ctrl.currRequireEsiaAdminLogin" ng-value="$ctrl.requiresEsiaAdminLogin.eachEntrance" ng-change="$ctrl.changeRequireEsiaAdminLogin()" track-changes>{{$ctrl.language.Generic.ServAdmin.kRequireEsiaAdminLoginEachEntrance}}
				</label>
			</div>
			<div class="radio">
				<label>
					<input type="radio" ng-model="$ctrl.currRequireEsiaAdminLogin" ng-value="$ctrl.requiresEsiaAdminLogin.afterChangePass"  ng-change="$ctrl.changeRequireEsiaAdminLogin()" track-changes>{{$ctrl.language.Generic.ServAdmin.kRequireEsiaAdminLoginAfterChangePass}}
				</label>
			</div>
			<div class="radio">
				<label>
					<input type="radio" ng-model="$ctrl.currRequireEsiaAdminLogin" ng-value="$ctrl.requiresEsiaAdminLogin.never"  ng-change="$ctrl.changeRequireEsiaAdminLogin()" track-changes>{{$ctrl.language.Generic.ServAdmin.kRequireEsiaAdminLoginNever}}
				</label>
			</div>
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kRequireEsiaAdminLoginFirstEntrance}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<div class="checkbox">
				<label>
					<input type="checkbox" ng-model="$ctrl.data.userAuthorizationSettings.requireEsiaAdminLoginFirstEntrance" track-changes>
				</label>
			</div>
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kEnableNotice}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<div class="checkbox">
				<label>
					<input type="checkbox" ng-model="$ctrl.data.userAuthorizationSettings.enableNotice" track-changes>
				</label>
			</div>
		</div>
	</div>

	<div class="form-group" ng-class="{'has-error': $ctrl.form.NoticeTitle.$invalid}">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kNoticeTitle}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<input type="text" name="NoticeTitle" class="form-control" size="100" maxlength="100" ng-model="$ctrl.data.userAuthorizationSettings.noticeTitle" track-changes ng-disabled="!$ctrl.data.userAuthorizationSettings.enableNotice" ng-required="$ctrl.data.userAuthorizationSettings.enableNotice">
			<div ng-messages="$ctrl.form.NoticeTitle.$error">
				<span class="help-block" ng-message="required">{{$ctrl.noticeError()}}</span>
			</div>
		</div>
	</div>

	<div class="form-group" ng-class="{'has-error': $ctrl.form.NoticeDisplayText.$invalid}">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kNotice}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<textarea name="NoticeDisplayText" ng-model="$ctrl.data.userAuthorizationSettings.noticeDisplayText" class="form-control" rows="3" wrap="soft" track-changes ng-disabled="!$ctrl.data.userAuthorizationSettings.enableNotice" ng-required="$ctrl.data.userAuthorizationSettings.enableNotice"></textarea>
			<div ng-messages="$ctrl.form.NoticeDisplayText.$error">
				<span class="help-block" ng-message="required">{{$ctrl.noticeError()}}</span>
			</div>
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kNoticeDateInterval}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">

			<edit-date-range-component ng-if="$ctrl.data.userAuthorizationSettings.enableNotice"
				start-date="$ctrl.data.userAuthorizationSettings.noticeStartDate"
				end-date="$ctrl.data.userAuthorizationSettings.noticeEndDate"
				options="$ctrl.dateRangeOptions"
				date-range="true">
			</edit-date-range-component>

			<div class="input-daterange input-group date" ng-if="!$ctrl.data.userAuthorizationSettings.enableNotice">
				<input type="text" class="input-md form-control" ng-value="$ctrl.data.userAuthorizationSettings.noticeStartDate | date: 'dd.MM.yyyy'" disabled>
				<span class="input-group-addon">{{$ctrl.language.Generic.ServAdmin.kTimeTo}}</span>
				<input type="text" class="input-md form-control" ng-value="$ctrl.data.userAuthorizationSettings.noticeEndDate | date: 'dd.MM.yyyy'" disabled>
			</div>
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kAllowedReturnUrl}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<input type="text" class="form-control" size="100" maxlength="500" ng-model="$ctrl.data.userAuthorizationSettings.allowedReturnUrl" track-changes>
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kOpenAuthPublicKey}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<textarea class="form-control" rows="5" wrap="soft" ng-model="$ctrl.data.userAuthorizationSettings.openAuthPublicKey" track-changes></textarea>
		</div>
	</div>
</form>
