<form class="form-horizontal" ng-if="$ctrl.state.ready">
    <div class="row">
        <div class="col-md-12">
            <div class="buttons-panel">
                <button title="{{$ctrl.language.Generic.ServAdmin.kSaveSettings}}" type="button" class="btn btn-primary" ng-click="$ctrl.save()">
                    <span class="glyphicon glyphicon-floppy-save"></span> <span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
                </button>
            </div>
        </div>
    </div>

    <div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kVkAppId}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<div class="input-group">
				<input type="text" class="form-control" size="100" maxlength="100" ng-model="$ctrl.data.chatsSettings.vkAppId" track-changes>
			</div>
		</div>
	</div>

    <div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kVkAppServiceToken}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<div class="input-group">
				<input type="text" class="form-control" size="100" maxlength="100" ng-model="$ctrl.data.chatsSettings.vkAppServiceToken" track-changes>
			</div>
		</div>
	</div>
</form>
