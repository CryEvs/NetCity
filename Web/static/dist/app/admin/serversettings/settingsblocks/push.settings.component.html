<div class="form-horizontal" ng-if="$ctrl.state.ready">
	<div class="row">
        <div class="col-md-12">
            <div class="buttons-panel">
                <button title="{{$ctrl.language.Generic.Common.kSave}}" type="button" class="btn btn-primary" ng-click="$ctrl.save()">
                    <span class="glyphicon glyphicon-floppy-save"></span> <span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
                </button>
            </div>
        </div>
    </div>

    <!-- todo: локализовать -->
    <div class="form-group">
        <label class="control-label col-md-4 col-lg-3 col-sm-4">Ключ сервера</label>
        <div class="col-md-8 col-lg-5 col-sm-8">
            <input type="text" class="form-control" size="200" maxlength="200" ng-model="$ctrl.data.pushSettings.serverKey" track-changes>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-md-4 col-lg-3 col-sm-4">Идентификатор отправителя</label>
        <div class="col-md-8 col-lg-5 col-sm-8">
            <input type="text" class="form-control" size="200" maxlength="200" ng-model="$ctrl.data.pushSettings.senderId" track-changes>
        </div>
    </div>
</div>
