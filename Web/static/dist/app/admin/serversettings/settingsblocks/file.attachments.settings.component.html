<div class="row">
	<div class="col-md-12">
		<div class="buttons-panel">
			<button title="{{$ctrl.language.Generic.Common.kSave}}" type="button" class="btn btn-primary" ng-click="$ctrl.save()">
				<span class="glyphicon glyphicon-floppy-save"></span> <span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
			</button>
		</div>
	</div>
</div>
<hr>

<div class="form-horizontal" ng-if="$ctrl.state.ready">
	<div style="padding-bottom:15px;">
		<label>{{$ctrl.language.Generic.ServAdmin.kFileStorageType}}</label>
		<div style="padding-left:20px;">
			<div class="radio">
				<label>
					<input type="radio" ng-model="$ctrl.data.fileAttachmentSettings.fileStorageType" value="Internal"> {{$ctrl.language.Generic.ServAdmin.kFileInternal}}
				</label>
			</div>
			<div class="radio">
				<label>
					<input type="radio" ng-model="$ctrl.data.fileAttachmentSettings.fileStorageType" value="FileStorageApi"> {{$ctrl.language.Generic.ServAdmin.kFileStorage}}
				</label>
			</div>
		</div>
	</div>

	<div class="form-group">
		<label class="control-label col-md-4 col-lg-3 col-sm-4">
			{{$ctrl.language.Generic.ServAdmin.kFileStorageApiAddress}}
		</label>
		<div class="col-md-8 col-lg-5 col-sm-8">
			<input type="text" class="form-control" ng-model="$ctrl.data.fileAttachmentSettings.fileStorageApiAddress" size="400" maxlength="400" track-changes>
		</div>
	</div>
</div>
