<ns-modal controller="$ctrl" header="{{$ctrl.header}}" buttons="$ctrl.buttons">
	<span class="content-page-preloader" id="preloader" ng-hide="$ctrl.ready"><span>{{$ctrl.language.Generic.Movement.kPleaseWait}}</span></span>
	<form class="form-horizontal form-sm" name="$ctrl.form" ng-if="$ctrl.ready">
		<ns-form>

            <ns-form-group title="Населенный пункт" ng-class="{'has-error': $ctrl.form.name.$invalid}">
                <p>{{$ctrl.currentCity.name}}</p>
			</ns-form-group>

			<legend style="text-decoration: none;">Заменить на</label>

			<ns-form-group title="Муниципалитет">
				<select class="form-control" name="municipality" required ng-model="$ctrl.replacerCityMunicipalityId" ng-options="x.id as x.name for x in $ctrl.municipalities" ng-change="$ctrl.refresh()" track-changes></select>
				<p ng-show="$ctrl.form.municipality.$error.required && ($ctrl.form.municipality.$dirty || $ctrl.form.$displayErrors)" class="help-block">Обязательное поле</p>
			</ns-form-group>
			
			<ns-form-group title="Населенный пункт">
				<select class="form-control" name="city" required ng-model="$ctrl.replacerCityId" ng-options="x.id as x.name for x in $ctrl.cities" track-changes></select>
				<p ng-show="$ctrl.form.city.$error.required && ($ctrl.form.city.$dirty || $ctrl.form.$displayErrors)" class="help-block">Обязательное поле</p>
			</ns-form-group>
			
		</ns-form>
	</form>
</ns-modal>
