<style>
	tr.active-current-org{
		background-color: #ffe755 !important;
	}
	tr.has-current-org{
		background-color: #ccc !important;
	}
	label.fio {
		font-weight: normal;
		cursor: pointer;
	}
	span.icon-expand {
		cursor: pointer;
		font-size: 14px;
	}
	span.icon-collapse {
		cursor: pointer;
		font-size: 14px;
	}
	tr.has-error {
		background-color: #ffe575 !important;
	}
	div.legend span.legend-invalid-movements {
		background-color: #ffe575;
  	}
	div.jtable-main-container div.jtable-title div.jtable-toolbar span.jtable-toolbar-item{
		border: 1px solid transparent;
		border-color: #286DA7;
		text-shadow: 0 1px 0 rgb(0 0 0 / 80%);
		box-shadow: inset 0 1px 0 rgb(255 255 255 / 80%);
		background-image: linear-gradient(to bottom, rgba(255, 255, 255, 0.084), rgba(255, 255, 255, 0.042));
		background-color: #286DA7;
		max-width: 155px;
		line-height: 1.1;
		text-align: center;
		height: 36px;
		padding-top: 3px;
		border-radius: 2px;
		font-size: 1em;
	} 
	div.jtable-main-container div.jtable-title div.jtable-toolbar span.jtable-toolbar-item:hover,
	div.jtable-main-container div.jtable-title div.jtable-toolbar span.jtable-toolbar-item:focus{
		background-image: none;
		background-color: #145389;
	}
</style>

<link rel="stylesheet" type="text/css" href="/vendor/components/jquery-ui/themes/redmond/jquery-ui.min.css">

<div class="col-md-12 buttons-filters-panel single-row form-horizontal">
	<div class="buttons-panel">
		<div class="buttons-panel-right" ng-if="$ctrl.loaded && !$ctrl.dataEmpty">
			<button title="{{$ctrl.language.Generic.Common.kBtnExcel}}" type="button" class="btn btn-default" ng-click="$ctrl.export()">
				<span class="glyphicon glyphicon-export"></span>
				<span>{{$ctrl.language.Generic.Common.kBtnExcel}}</span>
			</button>
		</div>
	</div>

	<div class="filters-panel">
		<div class="form-group">
			<label class="control-label col-md-4 col-lg-3 col-sm-4">Роли</label>
			<div class="col-md-8 col-lg-5 col-sm-8">
				<select class="form-control" name="kRoles" ng-model="$ctrl.role" ng-options="role.id as role.name for role in $ctrl.roles">
				</select>
			</div>
		</div>
		<div class="form-group"><label class="control-label col-md-4 col-lg-3 col-sm-4">Условия поиска</label>
			<div class="col-md-8 col-lg-5 col-sm-8">
				<select class="form-control" name="FIOPS" ng-model="$ctrl.searchType" ng-options="item.query as item.name for item in $ctrl.searchTypes">
				</select>
			</div>
		</div>
		<div class="form-group"><label class="control-label col-md-4 col-lg-3 col-sm-4">Фамилия</label>
			<div class="col-md-8 col-lg-5 col-sm-8">
				<input class="form-control" type="text" ng-model="$ctrl.lastname">
			</div>
		</div>
		<div class="form-group" >
			<label class="control-label col-md-4 col-lg-3 col-sm-4"></label>
			<div class="col-md-8 col-lg-5 col-sm-8">
				<div class="checkbox" ng-if="$ctrl.role == 'Students'">
					<label>
						<input type="checkbox" ng-checked="$ctrl.settings.activeEnrollmentInSchool" ng-click="$ctrl.settings.activeEnrollmentInSchool = !$ctrl.settings.activeEnrollmentInSchool"> Поиск среди обучающихся зачисленных <p ng-if="$ctrl.settings.schoolId > 0">в организацию </p>на текущий момент
					</label>
				</div>
				<div class="checkbox" ng-if="$ctrl.settings.schoolId > 0 && $ctrl.role != 'Students'">
					<label>
						<input type="checkbox" ng-checked="$ctrl.settings.activeEnrollmentInSchool" ng-click="$ctrl.settings.activeEnrollmentInSchool = !$ctrl.settings.activeEnrollmentInSchool"> Поиск среди обучающихся пользователей связанных с организацией на текущий момент
					</label>
				</div>
				<div class="checkbox" ng-if="$ctrl.settings.funcType == 3 && $ctrl.role == 'Students'">
					<label>
						<input type="checkbox" ng-checked="$ctrl.settings.outOfSystem" ng-click="$ctrl.settings.outOfSystem = !$ctrl.settings.outOfSystem"> Поиск среди обучающихся зачисленных из списка "Не зачисленные в систему"
					</label>
				</div>
				<div class="checkbox" ng-if="$ctrl.settings.funcType == 3 && $ctrl.role == 'Students'">
					<label>
						<input type="checkbox" ng-checked="$ctrl.settings.withoutMainOrganization" ng-click="$ctrl.settings.withoutMainOrganization = !$ctrl.settings.withoutMainOrganization"> Поиск среди обучающихся без основной организации на текущий момент
					</label>
				</div>
				<div class="checkbox" ng-if="$ctrl.role == 'Students'">
					<label>
						<input type="checkbox" ng-checked="!$ctrl.settings.withoutPoolNa" ng-click="$ctrl.settings.withoutPoolNa = !$ctrl.settings.withoutPoolNa"> Включая поиск среди обучающихся в архиве
					</label>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="row">
	<div class="col-md-12">
		<button title="Ахивировать" type="button" class="btn btn-sm btn-primary" ng-click="$ctrl.search()">
			<span class="glyphicon glyphicon-search"></span>
			<span>Загрузить</span>
		</button>
		<button title="Ахивировать" type="button" class="btn btn-sm btn-warning" ng-click="$ctrl.archive()" ng-if="$ctrl.role == 'Students' && $ctrl.settings.canBatchArchive">
			<span class="glyphicon glyphicon-briefcase"></span>
			<span>Ахивировать неиспользуемые записи</span>
		</button>
	</div>
</div>

<div class="row">
	<div class="col-md-12">
		<div id="PersonTableContainer" style="padding: 10px 0"></div>
	</div>
</div>
