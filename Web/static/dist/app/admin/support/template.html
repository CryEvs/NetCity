<button title="Движение" type="button" class="btn btn-info" ng-click="diagMovement()">
	<span class="glyphicon glyphicon-transfer"></span>
	<span>Движение</span>
</button>

<button title="Дубли" type="button" class="btn btn-info" ng-click="userClones()">
	<span class="glyphicon glyphicon-user"></span>
	<span>Дубли</span>
</button>

<button title="Документы" type="button" class="btn btn-info" ng-click="userDocuments()">
	<span class="glyphicon glyphicon-briefcase"></span>
	<span>Документы</span>
</button>

<button title="Очередь" type="button" class="btn btn-info" ng-click="queueTasks()">
	<span class="glyphicon glyphicon-tasks"></span>
	<span>Очередь задач</span>
</button>

<h2>Журнал безопасности</h2>

<button title="{{language.Generic.ServAdmin.kLogins}}" ng-click="loginAttempts()" type="button" class="btn btn-info">
	<span class="glyphicon glyphicon-arrow-up"></span>
	<span>{{language.Generic.ServAdmin.kLogins}}</span>
</button>
<button title="{{language.Generic.Secure.kPersonalDataAccess}}" ng-click="personalDataAccess()" type="button" class="btn btn-info">
	<span class="glyphicon glyphicon-eye-open"></span>
	<span>{{language.Generic.Secure.kPersonalDataAccess}}</span>
</button>


<h2>Наполнение данными</h2>

<button title="Пакетный импорт учащихся" ng-click="importStudents()" type="button" class="btn btn-info">
	<span class="glyphicon glyphicon-download"></span>
	<span>Пакетный импорт учащихся</span>
</button>

<button title="Пакетный импорт сотрудников" ng-click="importStaff()" type="button" class="btn btn-info">
	<span class="glyphicon glyphicon-download"></span>
	<span>Пакетный импорт сотрудников</span>
</button>

<button title="Сменить пароли сотрудников" ng-click="setStaffPasswords()" type="button" ng-show="isLocalHostView()" class="btn btn-info">
	<span class="glyphicon glyphicon-download"></span>
	<span>Сменить пароли сотрудников</span>
</button>

<button title="Отпрвить сообщение" ng-click="sendEmail()" type="button" ng-show="isLocalHostView()" class="btn btn-info">
	<span class="glyphicon glyphicon-download"></span>
	<span>Отпрвить сообщение</span>
</button>
