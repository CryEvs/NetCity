<script language="javascript" src="/vendor/select2/js/select2.full.min.js"></script>
<script language="javascript" src="/vendor/select2/js/i18n/ru.js"></script>

<div class="row">
	<div class="col-md-12">

		<div class="buttons-filters-panel form-horizontal single-row">
			<div class="row">
				<div class="buttons-panel">
					<div class="buttons-panel-right">
						<button title="Экспорт" type="button" class="btn btn-default" ng-click="export()" ng-show="state.dataReady && !state.emptyData">
							<span>Экспорт</span>
						</button>
					</div>
				</div>
				<div class="filters-panel col-md-12 filters-panel-compact"></div>
			</div>
		</div>
	</div>

</div>

<div class="row">
	<div class="col-md-12 form-group">
		<button id="load-btn" title={{language.Generic.Buttons.kLoad}} type="button" class="btn btn-primary btn-sm" ng-click="load()">
			<span class="glyphicon glyphicon-search"></span>
			<span>{{language.Generic.Buttons.kLoad}}</span>
		</button>
	</div>
</div>

<div class="content-preloader" ng-show="state.loading">
	<span class="arrows"></span>
	<span class="title">Пожалуйста подождите</span>
</div>

<div class="row">
	<div class="col-md-10">
		<div class="alert alert-info" ng-show="!state.dataReady && !state.loading" role="alert">Нажмите кнопку "Загрузить" для загрузки данных</div>
		<div class="alert alert-info" ng-show="state.dataReady && state.emptyData" role="alert">{{language.Generic.Common.kNoDataForFilter}}</div>
	</div>
</div>


<ul ng-show="state.dataReady && !state.emptyData && paging.totalRows > paging.pageSize" uib-pagination total-items="paging.totalRows" ng-model="paging.page" items-per-page="paging.pageSize" max-size="20" class="pagination-sm" direction-links="false" force-ellipses="true" ng-change="load()"></ul>

<div class="row" ng-if="state.dataReady && !state.emptyData">
	<div class="col-md-12">
		<table class="table table-thin table-xs table-xs table-bright table-bright-hover"  ng-class="{'table-selectable': state.selectable}">
			<tr>
				<th>
					№
					п/п
				</th>
				<th ng-repeat="field in data.fields">
					{{field.title}}
				</th>
			</tr>
			<tr ng-repeat="row in data.registryData.rows" ng-class="{'selected': selection.isSelected(row)}" ng-click="selection.select(row)">
				<td>{{row.rownum}}</td>
				<td ng-repeat="field in data.fields">
					<registry-field row="row" field="field"></registry-field>
				</td>
			</tr>
		</table>
	</div>
</div>

<ul ng-show="state.dataReady && !state.emptyData && paging.totalRows > paging.pageSize" uib-pagination total-items="paging.totalRows" ng-model="paging.page" items-per-page="paging.pageSize" max-size="20" class="pagination-sm" direction-links="false" force-ellipses="true" ng-change="load()"></ul>
