<div class="row">
	<div class="col-md-12">

		<div class="buttons-filters-panel form-horizontal form-sm single-row">
			<div class="row">

				<filter-panel class="filters-panel col-md-12" ng-if="$ctrl.filterPanelSettings" fp="$ctrl.filterPanel" fp-settings="$ctrl.filterPanelSettings"></filter-panel>

			</div>
		</div>
	</div>

</div>

<div class="row">
	<div class="col-md-12">
		<div class="buttons-panel" id="buttonPanel">
			<div class="buttons-panel-left" ng-if="!$ctrl.emptyData">
				<button title="{{$ctrl.language.Generic.Buttons.kGenerate}}" type="button" class="btn" ng-click="$ctrl.generate()">
					<span class="glyphicon glyphicon-random"></span>
					<span>{{$ctrl.language.Generic.Buttons.kGenerate}}</span>
				</button>
			</div>
		</div>
	</div>
</div>
