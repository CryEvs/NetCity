<div ng-model="AddFileAttachmentCtrl">
	<div class="bootstrap-dialog type-primary">
		<div class="modal-header">
			<div class="bootstrap-dialog-header">
				<div class="bootstrap-dialog-title">
					<h4 class="modal-title" ng-bind="header"></h4>
				</div>
			</div>
		</div>

		<div class="modal-body">
			<form role="form" name="docForm" class="form">
				<!--Поля формы-->

				<div class="form-group" ng-class="{'has-error': docForm.name.$invalid && (!docForm.name.$pristine || docForm.$displayErrors)}">
					<label for="doc-name" class="control-label">{{language.Generic.Common.kName}}</label>
					<div>
						<input track-changes type="text" id="doc-name" name="name" class="form-control" ng-model="data.doc.name" required
						 maxlength="200">
						<p ng-show="docForm.name.$invalid && (!docForm.name.$pristine || docForm.$displayErrors)" class="help-block">
							{{language.Generic.Common.kEnterDataInPlace}}</p>
					</div>
				</div>

				<div class="form-group" ng-class="{'has-error': (docForm.fileName.$invalid || fileSize > 10) && (!docForm.fileName.$pristine || docForm.$displayErrors)}">
					<label for="doc-file" class="control-label">{{language.Generic.Common.kFile}}</label>
					<div>
						<div class="input-group">
							<span class="btn btn-primary btn-file input-group-addon">
								{{language.Generic.Common.kChooseFile}}
								<input track-changes type="file" id="doc-file" ngf-select ng-model="data.doc.file" name="file" class="form-control file-input-filename">
							</span>
							<input type="text" class="form-control file-input-filename" id="fileName" name="fileName" ng-model="data.doc.fileName"
							 ng-required="!editMode" readonly>
						</div>
						<p ng-show="docForm.fileName.$invalid && (!docForm.fileName.$pristine || docForm.$displayErrors)" class="help-block">
							{{language.Generic.Common.kChooseFile}}</p>
						<p ng-show="fileSize > 10 && (!docForm.fileName.$pristine || docForm.$displayErrors)" class="help-block">
							{{language.Generic.SetupSchoolPortfolio.kFileSizeCantBeGreaterThan}}10 МБ</p>
					</div>
				</div>

				<div class="form-group">
					<label for="doc-description" class="control-label">{{language.Generic.Common.kAttachmentDescription}}</label>
					<div>
						<textarea track-changes id="doc-description" class="form-control" ng-model="data.doc.description"></textarea>
					</div>
				</div>
			</form>

		</div>

		<div class="modal-footer">
			<button class="btn btn-primary ng-binding" ng-click="save()">
				{{lazy ? language.Generic.Buttons.kAttachFile : language.Generic.Buttons.kSave}}
			</button>

			<button class="btn btn-default ng-binding" ng-click="cancel()">
				<span class="bootstrap-dialog-button-icon glyphicon glyphicon-remove-sign"></span>
				{{language.Generic.Buttons.kCancel}}
			</button>
		</div>

	</div>
</div>
