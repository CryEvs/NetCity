<link rel="stylesheet" type="text/css" href="/static/dist/pages/common/css/file-attachments.min.css">
<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-header">
			<div class="bootstrap-dialog-title">
				<h4 class="modal-title" ng-bind="ctrl.header"></h4>
			</div>
		</div>
	</div>

	<div style="max-height: 500px; overflow: auto;" class="modal-body">
		<table class="table table-hover table-bordered">
			<tr>
				<th>Сервер</th>
				<th>Статус</th>
				<th>Дата/время публикации</th>
				<th>Подробности</th>
			</tr>
			<tr ng-repeat="info in ctrl.data.publishInfo" ng-class="{'success': info.success, 'danger': !info.success}">
				<td>{{info.clientName}}</td>
				<td>{{info.publishStatusInfo}}</td>
				<td>{{info.publishTimeStr}}</td>
				<td>{{info.details}}</td>
			</tr>
		</table>
	</div>

	<div class="modal-footer" ng-show="ctrl.ready">
		<button class="btn btn-default ng-binding" ng-click="ctrl.cancel()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-remove-sign"></span>
			Закрыть
		</button>
	</div>
</div>
