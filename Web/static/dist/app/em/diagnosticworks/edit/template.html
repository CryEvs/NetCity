<link rel="stylesheet" type="text/css" href="/static/dist/pages/common/css/file-attachments.min.css">
<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-header">
			<div class="bootstrap-dialog-title">
				<h4 class="modal-title" ng-bind="ctrl.header"></h4>
			</div>
			<div class="bootstrap-dialog-close-button">
				<button class="close" ng-click="ctrl.cancel()">×</button>
			</div>
		</div>
	</div>

	<div class="modal-body">
		<span class="content-page-preloader" id="preloader" ng-hide="ctrl.ready"><span>{{ctrl.language.Generic.Movement.kPleaseWait}}</span></span>
		<form role="form" name="diagnosticWorkform" class="form-horizontal">
			<fieldset ng-disabled="ctrl.data.diagnosticWork.published">
				<div class="panel-group" id="formPanel" ng-show="ctrl.ready">

					<div class="form-group">
						<label for="subject" class="control-label col-md-4 col-lg-3 col-sm-4">{{ctrl.language.Generic.UsersExport_1C.kLevel}}</label>
						<div class="col-md-8 col-lg-9 col-sm-8">
							<select track-changes ng-disabled="ctrl.data.diagnosticWork.id"
							        class="form-control"
							        id="testLevel"
							        ng-init="testLevel = ctrl.data.diagnosticWork.testLevel"
							        ng-options="testLevel.id as testLevel.name for testLevel in ctrl.testLevels()"
							        required=""
							        ng-model="ctrl.data.diagnosticWork.testLevel"></select>
						</div>
					</div>

					<div class="form-group">
						<label for="subject" class="control-label col-md-4 col-lg-3 col-sm-4">{{ctrl.language.Generic.Common.kSubject}}</label>
						<div class="col-md-8 col-lg-9 col-sm-8">
							<select track-changes
							        class="form-control"
							        id="subject"
							        ng-init="subject = ctrl.data.diagnosticWork.subjectFipi"
							        ng-options="subject.name for subject in ctrl.data.subjects track by subject.id"
							        options-disabled="subject.id === -1"
							        ng-model="ctrl.data.diagnosticWork.subjectFipi"></select>
						</div>
					</div>

					<div class="form-group">

						<label for="grades" class="control-label col-md-4 col-lg-3 col-sm-4">{{ctrl.language.Generic.EMReports.kGrade}}</label>
						<div class="col-md-8 col-lg-9 col-sm-8">


							<ui-select track-changes
							           multiple
							           id="grades"
							           ng-model="ctrl.data.diagnosticWork.grades"
							           theme="bootstrap">
								<ui-select-match placeholder="Пожалуйста, выберите параллель">{{$item}}</ui-select-match>
								<ui-select-choices repeat="grade in ctrl.numGrades | filter: $select.search">
									<div ng-bind-html="grade | highlight: $select.search"></div>
								</ui-select-choices>
							</ui-select>
						</div>
					</div>

					<div class="form-group">
						<label for="dwname" class="control-label col-md-4 col-lg-3 col-sm-4">{{ctrl.language.Generic.Common.kName2}}</label>
						<div class="col-md-8 col-lg-9 col-sm-8">
							<input track-changes type="text" class="form-control" id="dwname" ng-model="ctrl.data.diagnosticWork.name" maxlength="200">
						</div>
					</div>

					<div class="form-group">
						<label for="dateRange" class="control-label col-md-4 col-lg-3 col-sm-4">Период проведения</label>
						<div class="col-md-8 col-lg-9 col-sm-8" ng-if="ctrl.ready">
							<edit-date-range-component
								start-date="ctrl.data.diagnosticWork.startDay"
								end-date="ctrl.data.diagnosticWork.endDay"
								options="ctrl.dateRangeOptions"
								date-range="true">
							</edit-date-range-component>
						</div>
					</div>

					<div ng-show="ctrl.isVpr(ctrl.data.diagnosticWork)" class="form-group">
						<label for="partsamount" class="control-label col-md-4 col-lg-3 col-sm-4">Количество частей</label>
						<div class="col-md-8 col-lg-9 col-sm-8" id="partsamount">
							<select class="form-control" track-changes ng-model="ctrl.data.diagnosticWork.vprForm.partsAmount">
								<option ng-value="{{1}}">1</option>
								<option ng-value="{{2}}">2</option>
								<option ng-value="{{3}}">3</option>
							</select>
						</div>
					</div>

					<div ng-if="ctrl.isVpr(ctrl.data.diagnosticWork) && ((ctrl.data.diagnosticWork.id && ctrl.data.diagnosticWork.vprForm.name) || (!ctrl.data.diagnosticWork.id))" class="form-group">
						<label for="fileName" class="control-label col-md-4 col-lg-3 col-sm-4">Форма сбора результатов</label>
						<div class="col-md-8 col-lg-9 col-sm-8">
							<div class="input-group wrap-flex-btn-files">
								<span class="btn btn-primary btn-file input-group-addon">
									{{ctrl.language.Generic.Common.kSelectFile}}
									<input track-changes type="file" id="doc-file" ngf-change="ctrl.changeFile($file)" ngf-select accept=".xls,.xlsx" ngf-model-options="{updateOn: 'change'}" ng-model="ctrl.data.diagnosticWork.vprForm.file" name="file" class="form-control file-input-filename" ng-disabled="ctrl.data.diagnosticWork.id">
								</span>
								<div ng-class="{'file-attachment': !ctrl.data.diagnosticWork.vprForm.file && ctrl.data.diagnosticWork.vprForm.name}">
									<input ng-if="!ctrl.data.diagnosticWork.id" type="text" class="form-control file-input-filename" disabled id="fileName" name="fileName" ng-model="ctrl.data.diagnosticWork.vprForm.name">
									<div ng-if="ctrl.data.diagnosticWork.id" id="fileName" name="fileName" class="file-info" ng-click="ctrl.openDoc('/webapi/diagnosticWorks/file?dwId=' + ctrl.data.diagnosticWork.id, ctrl.data.diagnosticWork.vprForm.name)">
										<span class="file-name">{{ctrl.data.diagnosticWork.vprForm.name}}</span>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div ng-if="ctrl.isVpr(ctrl.data.diagnosticWork) && ((!ctrl.data.diagnosticWork.id && !ctrl.data.diagnosticWork.vprForm.file) || ctrl.data.diagnosticWork.id)" class="form-group">
						<label class="control-label col-md-4 col-lg-3 col-sm-4">Код участника</label>
						<div class="col-md-8 col-lg-9 col-sm-8">
							<div class="input-group">
								<input track-changes type="number" class="form-control" size="6" maxlength="6" ng-min="1" ng-max="999999" ng-model="ctrl.data.diagnosticWork.vprForm.minStudentCode" ng-disabled="ctrl.data.diagnosticWork.vprForm && ctrl.data.diagnosticWork.vprForm.name">
								<span class="input-group-addon">—</span>
								<input track-changes type="number" class="form-control" size="6" maxlength="6" ng-min="1" ng-max="999999" ng-model="ctrl.data.diagnosticWork.vprForm.maxStudentCode" ng-disabled="ctrl.data.diagnosticWork.vprForm && ctrl.data.diagnosticWork.vprForm.name">
							</div>
						</div>
					</div>
					
				</div>
			</fieldset>
		</form>
	</div>

	<div class="modal-footer" ng-show="ctrl.ready">
		<button class="btn btn-primary ng-binding" ng-disabled="!diagnosticWorkform.$valid || ctrl.data.diagnosticWork.published" ng-click="ctrl.addDiagnosticWork(diagnosticWorkform.$valid)">
			{{ctrl.language.Generic.Buttons.kSave}}
		</button>
				
		<button class="btn btn-default ng-binding" ng-click="ctrl.cancel()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-remove-sign"></span>
			{{ctrl.language.Generic.Buttons.kCancel}}
		</button>
	</div>
</div>
