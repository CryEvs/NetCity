<div class="row">
	<div class="col-md-12" ng-show="!$ctrl.readMode || $ctrl.hasSelected">
		<form>
			<ns-form class="form-horizontal">
				<ns-form-group label-size="col-md-2" control-size="col-md-10" title="{{$ctrl.language.Generic.Common.kEOType}}">
					<select ng-model="$ctrl.funcTypeFilter"	ng-options="funcType.name for funcType in $ctrl.funcTypes" ng-change="$ctrl.reloadTree()" id="funcType" class="form-control">
						<option value="" selected>{{$ctrl.language.Generic.Common.kAll}}</option>
					</select>
				</ns-form-group>
				<ns-form-group label-size="col-md-2" control-size="col-md-10" title="{{$ctrl.language.Generic.FilterUsers.kSearch}}">
					<input id="filter" ng-model-options="{ debounce: 200 }" ng-model="$ctrl.filter" class="form-control" />
				</ns-form-group>
			</ns-form>
		</form>
	</div>
</div>

<div class="row">
	<div class="col-md-12" ng-show="(!$ctrl.readMode || $ctrl.hasSelected) && $ctrl.organizations.length != 0">
		<tree model="$ctrl.organizations" settings="$ctrl.treeSettings" on-update="$ctrl.internalOnUpdate(selected)"></tree>
	</div>
	<div class="col-md-12" ng-show="$ctrl.readMode && !$ctrl.hasSelected">
		<div class="alert alert-info">
			{{$ctrl.language.Generic.Common.kOrganizationsNotSelected}}
		</div>
	</div>
	<div class="col-md-12" ng-show="(!$ctrl.readMode || $ctrl.hasSelected) && $ctrl.organizations.length == 0">
		<div class="alert alert-info">
			{{$ctrl.language.Generic.Common.kNoMatchesFound}}
		</div>
	</div>
</div>
