<div >
	<div>

		<div class="row">
			<div class="col-md-12 col-lg-12">
				<div class="buttons-panel">
					<div class="buttons-panel-right">
						<button type="button" ng-click="exportAll()" class="btn btn-default">
							<span class="glyphicon glyphicon-export"></span>
							{{language.Generic.StatReports.kExportAllStatReports}}
						</button>
					</div>
				</div>
			</div>
		</div>


		<div class="row">
			<div class="col-md-8 col-lg-6">
				<form class="form-horizontal" role="form">
					<div class="form-group">
						<label for="indicatorLevel" class="col-md-4 control-label">{{language.Generic.StatReports.kIndicatorLevel}}</label>
						<div class="col-md-8">
							<select id="indicatorLevel" class="form-control" ng-model="indicatorLevel" ng-options="l.name for l in indicatorLevels"></select>
						</div>
					</div>

					<div class="form-group" ng-if="regionShowGroup">
						<label for="reportGroup" class="col-md-4 control-label">Группа отчетов</label>
						<div class="col-md-8">
							<select id="reportGroup" class="form-control" ng-model="reportGroup" ng-options="r.name for r in reportGroups"></select>
						</div>
					</div>

					<div class="form-group">
						<label for="indicatorGroup" class="col-md-4 control-label">{{language.Generic.StatReports.kIndicatorGroup}}</label>
						<div class="col-md-8">
							<select id="indicatorGroup" class="form-control" ng-model="indicatorGroup" ng-options="g.number + ' ' + g.name for g in rootGroups">
								<option value="" selected>{{language.Generic.StatReports.kSelectIndicatorGroup}}</option>
							</select>
						</div>
					</div>
					<div class="form-group">
						<div class="col-md-offset-4 col-md-8">
							<button type="button" ng-click="show()" class="btn btn-primary">
								<span class="glyphicon glyphicon-filter"></span>
								{{language.Generic.Buttons.kApply}}
							</button>

							<button type="button" ng-click="export()" class="btn btn-default">
								<span class="glyphicon glyphicon-export"></span>
								{{language.Generic.Common.kBtnExcel}}
							</button>
						</div>
					</div>
				</form>
			</div>
		</div>

		<div class="row">
			<div class="col-lg-8 col-md-10">
				<div class="alert alert-info" ng-show="dataLoaded && flatData.length < 1">
					{{language.Generic.StatReports.KIndicatorsDataNotFilled}}
				</div>
				<div class="alert alert-info" ng-show="!dataLoaded">
					{{language.Generic.StatReports.kNeedLoadIndicatorsData}}
				</div>

			</div>
		</div>
	</div>
</div>
<style>
	.dijitTooltipDialog {
		font: 12px Myriad,Helvetica,Tahoma,Arial,clean,sans-serif;
		*font-size: 75%;
	}

	.wpt-header-pane {
		font: 12px Myriad,Helvetica,Tahoma,Arial,clean,sans-serif;
		*font-size: 75%;
	}

	#wpt-container {
		font: 12px Myriad,Helvetica,Tahoma,Arial,clean,sans-serif;
		*font-size: 75%;
	}

	.hidden {
		display: none;
	}
</style>
