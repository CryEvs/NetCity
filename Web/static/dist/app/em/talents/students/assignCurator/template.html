<div>
	<div class="bootstrap-dialog type-primary">
		<div class="modal-header">
			<div class="bootstrap-dialog-header">
				<div class="bootstrap-dialog-title">
					<h4 class="modal-title" ng-bind="header"></h4>
				</div>
			</div>
		</div>

		<div class="modal-body">
			<span class="content-page-preloader" id="preloader" ng-hide="state.ready"><span>Пожалуйста подождите...</span></span>

			<form role="form" class="form form-xs" ng-show="state.ready">
				
				<div class="form-group">
					<label class="control-label">{{language.Common.kStudent}}</label>
					<div>
						<span>{{data.student.name}}</span>
					</div>
				</div>

				<div class="form-group">
					<label for="curator" class="control-label">{{language.Generic.TalentStudents.kCurator}}</label>
					<div>
						<span ng-show="data.curators.length == 0">
							{{language.Generic.TalentStudents.kNoCurators}}
						</span>

						<ui-select id="curator" ng-if="data.curators.length" ng-model="data.curator" theme="bootstrap">
							<ui-select-match placeholder="Выберите куратора">{{$select.selected.fio}}</ui-select-match>
							<ui-select-choices repeat="curator as curator in data.curators | filter: $select.search">
								<div ng-bind-html="curator.fio | highlight: $select.search"></div>
							</ui-select-choices>
						</ui-select>
					</div>
				</div>
			</form>

		</div>

		<div class="modal-footer">
			<button class="btn btn-primary ng-binding" ng-click="save()" ng-disabled="!data.curator">
				<span class="bootstrap-dialog-button-icon glyphicon glyphicon-ok"></span>
				{{language.Generic.Buttons.kSave}}
			</button>
			
			<button class="btn btn-danger ng-binding" ng-click="remove()" ng-if="state.edit">
				<span class="bootstrap-dialog-button-icon glyphicon glyphicon-remove"></span>
				Удалить назначение
			</button>

			<button class="btn btn-default ng-binding" ng-click="cancel()">
				<span class="bootstrap-dialog-button-icon glyphicon glyphicon-remove-sign"></span>
				{{language.Generic.Buttons.kCancel}}
			</button>
		</div>

	</div>
</div>
