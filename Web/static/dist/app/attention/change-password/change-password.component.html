<div class="container" ng-if="$ctrl.ready">
	<common-change-password options="$ctrl.options"></common-change-password>
	<div>
		<div class="row">
			<div class="col-md-12">
				<div class="buttons-panel">
					<div class="buttons-panel-left">
						<button title="{{$ctrl.language.Generic.Common.kExit}}" type="button" class="btn btn-default" ng-click="$ctrl.logout()">
							<span class="glyphicon glyphicon-off"></span>
							<span>{{$ctrl.language.Generic.Common.kExit}}</span>
						</button>
						<button title="{{$ctrl.language.Generic.Common.kbtnSavePassword}}" type="button" class="btn btn-primary" ng-click="$ctrl.save()">
							<span class="glyphicon glyphicon-floppy-save"></span>
							<span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
						</button>
						<button ng-if="$ctrl.ssoLogin && !$ctrl.safe" title="{{$ctrl.language.Generic.Common.kSkip}}" type="button" class="btn btn-default" ng-click="$ctrl.skip()">
							<span>{{$ctrl.language.Generic.Common.kSkip}}</span>
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
