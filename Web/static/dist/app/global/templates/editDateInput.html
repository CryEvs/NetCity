<div class="input-group date">
	<input track-changes type="text" class="form-control date-input" name="$ctrl.name" size="11" maxlength="10" ns-date-model="$ctrl.startDate" ng-required="$ctrl.isRequired">
	<span class="input-group-btn">
		<button title="" type="button" class="btn btn-primary">
			<span class="glyphicon glyphicon-calendar"></span>
		</button>
	</span>
</div>
