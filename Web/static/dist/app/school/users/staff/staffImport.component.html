<filter-panel class="filters-panel col-md-12 filters-panel-compact" ng-if="ctrl.filterPanelSettings" fp="ctrl.filterPanel" fp-settings="ctrl.filterPanelSettings"></filter-panel>

<div class="filters-panel col-md-12 filters-panel-compact">
	<button title="Импорт" type="button" class="btn btn-default" ng-click="ctrl.doImport()">
		<span class="glyphicon glyphicon-import"></span>
		<span>Импорт</span></button>
</div>

<div class="content">
	<div class="container-fluid">
		<div class="row">
			<div class="col-md-12">
				<form>
					<div class="buttons-filters-panel form-horizontal">

						<div> 
							<label>
								<input type="checkbox" id="All" ng-checked="ctrl.isAllSelected" ng-click="ctrl.toggleSelectAll()">&nbsp;&nbsp;Все
							</label>
						</div>

						<div ng-repeat="item in ctrl.staffs" class="checkbox">
							<label title="{{ctrl.getItemTitle(item)}}">
								<input type="checkbox" ng-checked="ctrl.selection.isSelected(item)"
									ng-click="ctrl.selection.select(item)" name="StaffID"
									ng-disabled="{{item.isAdminName}}"
									title="{{ctrl.getItemTitle(item)}}">{{item.nickName}}
							</label>
						</div>

				</form>
			</div>
		</div>
	</div>
</div>
