<table class="table table-bordered">
	<thead>
		<tr>
			<th>ФИО</th>
			<th>Имя на экране</th>
			<th>Имя для входа</th>
			<th>Новый пароль</th>
		</tr>
	</thead>
	<tbody>
		{{#each @root.persons}}
		<tr>
			<td>{{fullname}}</td>
			<td>{{nickname}}</td>
			<td>{{loginName}}</td>
			<td>{{password}}</td>
		</tr>
		{{/each}}
	</tbody>
</table>
