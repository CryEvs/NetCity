<div class="row">
	<div class="col-md-12">
		<div class="buttons-panel">

			<button title="Редактировать руководителей" type="button" class="btn btn-info" ng-click="edit()">
				<span class="glyphicon glyphicon-pencil"></span>
				<span>Добавить/Редактировать</span>
			</button>
			
			<button title="Удалить руководителей" type="button" class="btn btn-danger" ng-click="delete()" ng-disabled="data.selected.length === 0">
				<span class="glyphicon glyphicon-minus-sign"></span>
				<span>Удалить</span>
			</button>

		</div>
	</div>
</div>

<div class="row">
	<div class="col-md-12">
		<form class="form-horizontal">

			<div class="form-group">
				<label class="control-label col-md-4 col-lg-2 col-sm-4">Образовательная организация</label>
				<div class="col-md-8 col-lg-3 col-sm-8">
					<select name="school" class="form-control" ng-model="filter.selected.schoolId" ng-options="school.id as school.name for school in filter.items.schools" ng-change="filterViewLeaders()"></select>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-md-4 col-lg-2 col-sm-4">Группа пользователей</label>
				<div class="col-md-8 col-lg-3 col-sm-8">
					<select name="userGroup" class="form-control" ng-model="filter.selected.userType" ng-options="userType.id as userType.name for userType in filter.items.userTypes" ng-change="filterViewLeaders()"></select>
				</div>
			</div>

		</form>
	</div>
</div>

<div class="alert alert-info" role="alert" ng-if="data.leaders.length == 0">Нет руководителей портфолио</div>
<div class="alert alert-info" role="alert" ng-if="data.viewLeaders.length == 0">Нет руководителей портфолио по данному фильтру</div>

<div class="row">
	<div class="col-md-12">
		<table class="table table-thin table-bright table-bright-hover table-selectable" ng-show="data.viewLeaders.length > 0">
			<tr>
				<th>Имя на экране</th>
				<th>{{language.Generic.Common.kEO}}</th>
				<th></th>
			</tr>
			<tr ng-repeat="leader in data.viewLeaders" ng-class="{'selected': selected(leader)}" ng-click="toggle(leader)">
				<td>{{leader.nickName}}</td>
				<td>{{leader.orgname}}</td>
				<td><span class="check-mark"></span></td>
			</tr>
		</table>
	</div>
</div>
