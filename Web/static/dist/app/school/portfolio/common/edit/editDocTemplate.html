<div ng-model="EditPortfolioDocCtrl">
	<div class="bootstrap-dialog type-primary">
		<div class="modal-header">
			<div class="bootstrap-dialog-header">
				<div class="bootstrap-dialog-title">
					<h4 class="modal-title" ng-bind="header"></h4>
				</div>
			</div>
		</div>

		<div class="modal-body">
			<form role="form" name="docForm" class="form">
				<!--Поля формы-->

				<div class="form-group" ng-class="{'has-error': docForm.name.$invalid && (!docForm.name.$pristine || docForm.$displayErrors)}">
					<label for="doc-name" class="control-label">Название</label>
					<div>
						<input type="text" id="doc-name" name="name" class="form-control" ng-model="data.doc.name" required maxlength="200">
						<p ng-show="docForm.name.$invalid && (!docForm.name.$pristine || docForm.$displayErrors)" class="help-block">Заполните название</p>
					</div>
				</div>	 
				
				<div class="form-group" ng-class="{'has-error': docForm.fileName.$invalid && (!docForm.fileName.$pristine || docForm.$displayErrors)}">
					<label for="doc-file" class="control-label">Файл</label>
					<div>
						<div class="input-group">
							<span class="btn btn-primary btn-file input-group-addon">
								Выберите файл
								<input type="file" id="doc-file" ngf-select ng-model="data.doc.file" name="file" class="form-control file-input-filename">
							</span>
							<input type="text" class="form-control file-input-filename" id="fileName" name="fileName" ng-model="data.doc.fileName" required readonly>
						</div>
						<p ng-show="docForm.fileName.$invalid && (!docForm.fileName.$pristine || docForm.$displayErrors)" class="help-block">Выберите файл</p>
					</div>
				</div>

				<div class="form-group">
					<label for="doc-description" class="control-label">Описание</label>
					<div>
						<textarea id="doc-description" class="form-control" ng-model="data.doc.description" onchange="dataChanged()"></textarea>
					</div>
				</div>
			</form>

		</div>

		<div class="modal-footer">
			<button class="btn btn-primary ng-binding" ng-click="save()">
				{{language.Generic.Buttons.kSave}}
			</button>

			<button class="btn btn-default ng-binding" ng-click="cancel()">
				<span class="bootstrap-dialog-button-icon glyphicon glyphicon-remove-sign"></span>
				{{language.Generic.Buttons.kCancel}}
			</button>
		</div>

	</div>
</div>
