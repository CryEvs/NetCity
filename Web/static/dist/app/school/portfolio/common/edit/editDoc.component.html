<ns-modal controller="$ctrl" header="{{$ctrl.header}}" buttons="$ctrl.buttons">
    <form class="form" name="$ctrl.docForm">
        <ns-form control-size="col-xs-9" label-size="col-xs-3" class="form">
            <div class="form-group" ng-class="{'has-error': $ctrl.docForm.name.$invalid && (!$ctrl.docForm.name.$pristine || $ctrl.docForm.$displayErrors)}">
                <label for="doc-name" class="control-label">Название</label>
                <div>
                    <input track-changes type="text" id="doc-name" name="name" class="form-control" ng-model="$ctrl.data.doc.name" required maxlength="200">
                    <p ng-show="$ctrl.docForm.name.$invalid && (!$ctrl.docForm.name.$pristine || $ctrl.docForm.$displayErrors)" class="help-block">Заполните название</p>
                </div>
            </div>

            <div class="form-group" ng-class="{'has-error': $ctrl.docForm.fileName.$invalid && (!$ctrl.docForm.fileName.$pristine || $ctrl.docForm.$displayErrors)}">
                <label for="doc-file" class="control-label">Файл</label>
                <div>
                    <div class="input-group">
							<span class="btn btn-primary btn-file input-group-addon">
								Выберите файл
								<input track-changes type="file" id="doc-file" ngf-select ng-model="$ctrl.data.doc.file" name="file" class="form-control file-input-filename">
							</span>
                        <input type="text" class="form-control file-input-filename" id="fileName" name="fileName" ng-model="$ctrl.data.doc.fileName" required readonly>
                    </div>
                    <p ng-show="$ctrl.docForm.fileName.$invalid && (!$ctrl.docForm.fileName.$pristine || $ctrl.docForm.$displayErrors)" class="help-block">Выберите файл</p>
                </div>
            </div>

            <div class="form-group">
                <label for="doc-description" class="control-label">Описание</label>
                <div>
                    <textarea track-changes id="doc-description" class="form-control" ng-model="$ctrl.data.doc.description"></textarea>
                </div>
            </div>
        </ns-form>
    </form>
</ns-modal>
