<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-title">
			<h4 class="modal-title">{{ctrl.title}}</h4>
		</div>
	</div>
	<div class="modal-body">
		<form name="TimeForm" class="form-horizontal">
			<div class="form-group">
				<label class="control-label col-md-3">{{ctrl.language.Generic.Calendar.kRange}}</label>
				<div class="col-md-9">
					<select class="form-control" name="changePeriod" ng-options="p as p.name for p in ctrl.periodTypes track by p.id" ng-model="ctrl.periodType" ng-change="ctrl.onChangePeriodType()"></select>
				</div>
			</div>
			<div class="form-group">
				<label class="control-label col-md-3">{{ctrl.language.Generic.Calendar.kDateRange}}</label>
				<div class="col-md-9">
					<div class="input-daterange input-group date">
						<input type="text" class="input-md form-control" name="StartChngPeriod" ng-model="ctrl.startDate" ng-change="ctrl.changeDate()">
						<span class="input-group-addon">по</span>
						<input type="text" class="input-md form-control" name="EndChngPeriod" ng-model="ctrl.endDate" ng-change="ctrl.changeDate()">
					</div>
				</div>
			</div>
			<div class="form-group" ng-hide="ctrl.notShowWeekPattern">
				<label class="control-label col-md-3">{{ctrl.language.Generic.Calendar.kWeekPattern}}</label>
				<div class="col-md-9">
					<label class="radio-inline" ng-repeat="option in ctrl.skipWeeksOptions track by $index">
						 <input type="radio" name="pattern" ng-model="ctrl.skipWeeks" ng-value="option.id"> {{option.name}}
					</label> 
				</div>
			</div>
		</form>
	</div>

	<div class="modal-footer">
		<button class="btn btn-primary" ng-click="ctrl.apply()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-ok-sign"></span>
			<span>{{ctrl.language.Generic.Buttons.kApply}}</span>
		</button>

		<button class="btn btn-default" ng-click="ctrl.cancel()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-ban-circle"></span>
			{{ctrl.language.Generic.Buttons.kCancel}}
		</button>
	</div>
</div>
