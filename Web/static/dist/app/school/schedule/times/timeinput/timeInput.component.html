<div class="input-group date">
	<input track-changes uib-timepicker-popup id="timeInput" class="form-control" ng-model="$ctrl.date" is-open="$ctrl.opened" options="$ctrl.options" ng-click="$ctrl.open($event)" readonly/>
	<span class="input-group-btn">
		<button class="btn btn-primary" ng-click="$ctrl.open($event)">
			<i class="glyphicon glyphicon-time"></i>
		</button>
	</span>
</div>
