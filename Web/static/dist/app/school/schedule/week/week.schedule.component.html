<link rel="stylesheet" type="text/css" href="/static/dist/pages/schedule/css/schedule.min.css">
<style>
	.loading table.schedule-table {
		opacity: 0;
	}
	table.schedule-table td.filled-cell a {
		display: block;
	}
	.cm-edit {
		cursor: pointer;
	}
	.cm-edit:hover {
		text-decoration: underline;
	}
	.cm-add {
		visibility: hidden;
		position: relative;
		width: 10px;
		height: 10px;
		float: right;
		left: -7px;
		cursor: pointer;
	}
	.cm-cell {
		min-width: 110px;
	}
	.cm-cell:hover .cm-add {
		visibility: visible;
	}
</style>

<div class="row ns-cloak" ng-hide="$ctrl.editingMode && $ctrl.withClickEditMode">
	<div class="col-md-12 buttons-filters-panel form-horizontal single-row">

		<div class="buttons-panel">
			<div class="buttons-panel-right">
				<button title="{{$ctrl.language.Generic.Buttons.kPrint}}" type="button" class="btn btn-default" ng-click="$ctrl.print()">
					<span class="glyphicon glyphicon-print"></span>
					<span>{{$ctrl.language.Generic.Buttons.kPrint}}</span>
				</button>
				<button title="{{$ctrl.language.Generic.Common.kBtnExcel}}" type="button" class="btn btn-default"  ng-click="$ctrl.export()">
					<span class="glyphicon glyphicon-export"></span>
					<span>{{$ctrl.language.Generic.Common.kBtnExcel}}</span>
				</button>
			</div>
		</div>

		<filter-panel class="filters-panel filters-panel-compact" ng-if="$ctrl.filterPanelSettings"	fp="$ctrl.filterPanel" fp-settings="$ctrl.filterPanelSettings"></filter-panel>
	</div>
</div>

<schedule-quick-edit-panel schedule-ctrl="$ctrl" ng-if="$ctrl.withQuickEdit"></schedule-quick-edit-panel>

<div>
	<div>
		<div class="content-preloader" ng-if="$ctrl.loading">
			<span class="arrows"></span>
			<span class="title">{{$ctrl.language.Generic.Movement.kPleaseWait}}</span>
		</div>

		<div class="alert alert-info" role="alert" ng-if="$ctrl.state.emptyFilter">
			{{$ctrl.emptyFilterMessage}}
		</div>

		<div ng-if="!$ctrl.state.emptyFilter">

			<week-view-week-days ng-if="$ctrl.viewData && $ctrl.viewType == 0" ng-class="{'loading': $ctrl.loading}" data="$ctrl.viewData" week-end-set="$ctrl.weekEndSet">
			</week-view-week-days>

			<week-view-classes ng-if="$ctrl.viewData && $ctrl.viewType == 1" ng-class="{'loading': $ctrl.loading}" data="$ctrl.viewData">
			</week-view-classes>

			<week-view-teachers ng-if="$ctrl.viewData && $ctrl.viewType == 2 && $ctrl.teachers" 
				ng-class="{'loading': $ctrl.loading}" data="$ctrl.viewData" teachers="$ctrl.teachers" cm-teachers-dct="$ctrl.cmTeachersDct">
			</week-view-teachers>

		</div>
	</div>
</div>
