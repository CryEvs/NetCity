<div class="text-compact print-block">
	<div align="center"><b>Раздел 1. Сведения об организации</b> (на конец отчетного года)</div>
	<br>

	<table class="ThinTable" align="center" border=1 cellpadding=3 cellspacing=0>

			<td>Наименование показателя</td>
			<td>№ строки</td>
			<td>Код</td>
		</tr>
		<tr align="middle" valign="center">
			<td>1</td><td>2</td><td>3</td>
		</tr>
		<tr align="middle" valign="center">
			<td align="left">Тип организации</td>
			<td>101</td>
			<td><ns-form-text-input param="'T010103'" section="section"></ns-form-text-input></td>
		</tr>
		<tr align="middle" valign="center">
			<td align="left">Тип поселения</td>
			<td>102</td>
			<td><ns-form-text-input param="'T010203'" section="section"></ns-form-text-input></td>
		</tr>
		<tr align="middle" valign="center">
			<td align="left">Статус организации</td>
			<td>103</td>
			<td><ns-form-text-input param="'T010303'" section="section"></ns-form-text-input></td>
		</tr>
		<tr align="middle" valign="center">
			<td align="left">Режим функционирования</td>
			<td>104</td>
			<td><ns-form-text-input param="'T010403'" section="section"></ns-form-text-input></td>
		</tr>
		<tr align="middle" valign="center">
			<td align="left">
				Наличие коллегиального органа управления с участием общественности (1 - да, 2 - нет)
			</td>
			<td>105</td>
			<td><ns-form-bool-input param="'T010503'" section="section" config="{options:['1','2']}"></ns-form-bool-input></td>
		</tr>
	</table>
</div>
