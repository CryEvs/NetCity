<div class="bootstrap-dialog type-primary">

		<!-- ЗАГОЛОВОК МОДАЛЬНОГО ОКНА -->
		<div class="modal-header">
			<div class="bootstrap-dialog-title">
				<h4 class="modal-title">{{ctrl.header}}</h4>
			</div>
			<div class="bootstrap-dialog-close-button">
				<button class="close" ng-click="ctrl.cancel()">×</button>
			</div>
		</div>
	
	
		<!-- ТЕЛО МОДАЛЬНОГО ОКНА -->
		<div class="modal-body">
			<form>
				<fieldset>
					<legend>{{ctrl.language.Generic.Common.kGeneralInformation}}</legend>
					
					<!-- УЧАЩИЙСЯ -->
					<div class="form-group row">
						<label class="control-label col-md-4 col-lg-3 col-sm-4">
							{{ctrl.language.Generic.Common.kLearner}}
						</label>
						<div class="col-md-8 col-lg-9 col-sm-8">

							<ui-select track-changes id="support-student" ng-model="ctrl.data.student" theme="bootstrap" ng-if="ctrl.state.createMode">
								<ui-select-match placeholder="Пожалуйста, введите 3 или более символов">{{$select.selected.name}}</ui-select-match>
								<ui-select-choices repeat="student as student in ctrl.data.search.students.items"
								                   ui-disable-choice="student.name === 'Совпадений не найдено' || student.name === 'Поиск...'"
								                   refresh="ctrl.data.search.students.search($select.search)">
									<div ng-bind-html="student.name | highlight: $select.search"></div>
								</ui-select-choices>
							</ui-select>
							
							<input type="text" class="form-control" ng-model="ctrl.data.student.name" ng-if="ctrl.state.editMode" disabled/>

							<!--<select2 class="form-control" required s2-options="[]" options="ctrl.select2Settings.students" ng-model="null" track-changes></select2>-->
						</div>
					</div>
					<!---->
					<!-- ПРИЧИНА ВКЛЮЧЕНИЯ В ПРОГРАММУ -->
					<div class="form-group row">
						<label class="control-label col-md-4 col-lg-3 col-sm-4">
							Причина включения в программу
						</label>
						<div class="col-md-8 col-lg-9 col-sm-8" ng-if="ctrl.ready">
							<select2 class="form-control" required multiple options="ctrl.select2Settings.reasons" ng-model="ctrl.data.reasons" track-changes></select2>
						</div>
					</div>
					<!-- ПРИЧИНА ВКЛЮЧЕНИЯ В ПРОГРАММУ.ИНОЕ -->
					<div class="form-group row" ng-if="ctrl.ready && ctrl.selectedOtherReason()">
						<label class="control-label col-md-4 col-lg-3 col-sm-4">
							Иное
						</label>
						<div class="col-md-8 col-lg-9 col-sm-8">
							<input type="text" class="form-control" name="Other" ng-model="ctrl.data.otherReason" ng-readonly="ctrl.cantEditing()" track-changes />
						</div>
					</div>
					<!---->
					<!-- ПРИЧИНА ВКЛЮЧЕНИЯ В ПРОГРАММУ.ПРОБЛЕМЫ В ОБУЧЕНИИ И НЕ УСПЕВАЕТ ПО ОТДЕЛЬНЫМ ПРЕДМЕТАМ -->
					<div class="form-group row" ng-if="ctrl.ready && ctrl.canSelectSubject()" ng-init="ctrl.initSupportSubjects()">
						<label class="control-label col-md-4 col-lg-3 col-sm-4">
							{{ctrl.language.Generic.Common.kSubject}}
						</label>
						<div class="col-md-8 col-lg-9 col-sm-8" ng-if="ctrl.select2Settings.subjects.data">
							<select2 class="form-control" required multiple options="ctrl.select2Settings.subjects" ng-model="ctrl.data.subjects" track-changes></select2>
						</div>
					</div>

					<div ng-if="ctrl.state.editMode">
						<legend>Проведенные мероприятия</legend>
						<edit-measure-list supportid="ctrl.supportId"></edit-measure-list>
					</div>

				</fieldset>
			</form>
		</div>

		<div class="modal-footer">

			<button class="btn btn-primary btn-sm" ng-click="ctrl.add()" ng-if="ctrl.state.createMode && ctrl.commonInfoExists()">
				<span class="glyphicon glyphicon-floppy-save"></span>
				<span>{{ctrl.language.Generic.Buttons.kAdd}}</span>
			</button>

			<button class="btn btn-primary btn-sm" ng-click="ctrl.save()" ng-if="ctrl.state.editMode && !ctrl.state.readOnly">
				<span class="glyphicon glyphicon-floppy-save"></span>
				<span>{{ctrl.language.Generic.Buttons.kSave}}</span>
			</button>

			<button class="btn btn-default btn-sm" ng-click="ctrl.cancel()" ng-if="ctrl.state.createMode">
				<span class="bootstrap-dialog-button-icon glyphicon glyphicon-ban-circle"></span>
				<span>{{ctrl.language.Generic.Buttons.kCancel}}</span>
			</button>

			<button class="btn btn-default btn-sm" ng-click="ctrl.cancel()" ng-if="ctrl.state.editMode">
				<span class="bootstrap-dialog-button-icon glyphicon glyphicon-ban-circle"></span>
				<span>{{ctrl.language.Generic.Buttons.kClose}}</span>
			</button>
	
		</div>
	</div>
