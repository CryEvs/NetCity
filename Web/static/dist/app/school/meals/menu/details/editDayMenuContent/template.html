<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-header">
			<div class="bootstrap-dialog-title">
				<h4 class="modal-title" ng-bind="header"></h4>
			</div>
			<div class="bootstrap-dialog-close-button">
				<button class="close" ng-click="cancel()">&times;</button>
			</div>
		</div>
	</div>

	<div class="modal-body">
		<span class="content-page-preloader" id="preloader" ng-hide="state.viewReady"><span>Пожалуйста подождите...</span></span>

		<form role="form" name="eventForm" class="form-horizontal form-sm ng-scope">
			<!--Поля формы-->
			<fieldset>
				<div class="row form-group" ng-class="{'has-error': eventForm.content.$invalid && (!eventForm.content.$pristine || eventForm.$displayErrors)}">
					<label for="content-dish-new" ng-show="mode.create" class="control-label col-md-4 col-lg-3 col-sm-4">Блюдо</label>
					<label for="content-dish-edit" ng-show="mode.edit" class="control-label col-md-4 col-lg-3 col-sm-4">Блюдо</label>
					<div class="col-md-8 col-lg-9 col-sm-8">
						<select class="form-control" ng-show="mode.create" id="content-dish-new" name="content" required ng-options="dish.name for dish in data.refs.dishes track by dish.id" ng-init="data.content.dish" ng-model="data.content.dish"></select>
						<input class="form-control" ng-show="mode.edit" id="content-dish-edit" ng-model="data.content.dish.name" maxlength="200" ng-change="onChange()" type="text" disabled="">
						<p ng-show="eventForm.content.$invalid && (!eventForm.content.$pristine || eventForm.$displayErrors)" class="help-block">Блюдо должно быть выбрано</p>
					</div>
				</div>
			
				<div class="row form-group" ng-class="{'has-error': eventForm.weight.$invalid && (!eventForm.weight.$pristine || eventForm.$displayErrors)}">
					<label for="content-weight" class="control-label col-md-4 col-lg-3 col-sm-4">Вес, г.</label>
					<div class="col-md-8 col-lg-9 col-sm-8">
						<input type="number" id="content-weight" name="weight" required ng-model="data.content.weight" class="form-control" step="0.1" />
						<p ng-show="eventForm.weight.$invalid && (!eventForm.weight.$pristine || eventForm.$displayErrors)" class="help-block">Вес должен быть заполнен</p>
					</div>
				</div>
			</fieldset>	
		</form>

	</div>
	<div class="modal-footer" ng-show="state.viewReady">
		<button class="btn btn-primary ng-binding" ng-if="mode.edit" ng-click="eventForm.$displayErrors=true; save(eventForm.$valid)">
			Сохранить
		</button>

		<button class="btn btn-primary ng-binding" ng-if="mode.create" ng-click="eventForm.$displayErrors=true; save(eventForm.$valid)">
			Добавить
		</button>

		<button class="btn btn-default ng-binding" ng-click="cancel()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-remove-sign"></span>
			Закрыть
		</button>
	</div>
</div>
