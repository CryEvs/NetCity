<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-header">
			<div class="bootstrap-dialog-title">
				<h4 class="modal-title" ng-bind="header"></h4>
			</div>
			<div class="bootstrap-dialog-close-button">
				<button class="close" ng-click="cancel()">&times;</button>
			</div>
		</div>
	</div>

	<div class="modal-body">
		<form role="form" name="mealMenuForm" class="form-horizontal form-sm">
			<!--Поля формы-->

			<div class="form-group">
				<label for="menu-name" class="control-label col-md-4 col-lg-3 col-sm-4">Наименование</label>
				<div class="col-md-8 col-lg-9 col-sm-8">
					<input type="text" class="form-control" id="menu-name" ng-model="data.menu.name" />
				</div>
			</div>

		</form>

	</div>
	<div class="modal-footer">
		<button class="btn btn-primary ng-binding" ng-click="create()">
			Добавить
		</button>

		<button class="btn btn-default ng-binding" ng-click="cancel()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-remove-sign"></span>
			Закрыть
		</button>
	</div>
</div>
