<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-title">
			<h4 class="modal-title">{{title}}</h4>
		</div>
	</div>
	<div class="modal-body">
		<form role="form" name="educCertifForm" class="form form-xs">
			<div class="form-group">
				<label for="certif-user" class="control-label">ФИО учащегося</label>
				<div class="" ng-if="!certif.id">
					<ui-select id="certif-user" ng-model="student" theme="bootstrap" on-select="studentSelect($item)">
						<ui-select-match placeholder="Пожалуйста, введите 3 или более символов">{{$select.selected.name}}</ui-select-match>
						<ui-select-choices repeat="user as user in searchCtx.students.items"
						                   ui-disable-choice="user.name === 'Совпадений не найдено' || user.name === 'Поиск...'"
						                   refresh="searchCtx.students.search($select.search)">
							<div ng-bind-html="user.searchName || user.name | highlight: $select.search"></div>
						</ui-select-choices>
					</ui-select>
				</div>
				<div ng-if="certif.id">
					<input type="text" id="student" name="student" class="form-control" ng-model="certif.fio" disabled>
				</div>
			</div>
			<div class="form-group" ng-if="certif.id">
				<label for="number" class="control-label">Номер</label>
				<input type="text" id="number" name="number" class="form-control" ng-model="certif.number" required maxlength="10" disabled>
			</div>
			<div class="form-group" ng-class="{'has-error': !certif.startDate}">
				<label for="start-date" class="control-label">Дата начала действия</label>
				<div class="input-group date" id="start-date">
					<input type="text" class="form-control date-input" name="startdate" size="11" maxlength="10" ns-date-model="certif.startDate" onchange="dataChanged()">
					<span class="input-group-btn"><button title="" type="button" class="btn btn-primary"><span class="glyphicon glyphicon-calendar"></span> </button></span>
				</div>
				<p ng-show="!certif.startDate" class="help-block">Обязательное поле</p>
			</div>
			<div class="form-group" ng-class="{'has-error': !endDateStr}">
				<label for="end-date" class="control-label">Дата окончания действия</label>
				<div class="input-group date" id="end-date">
					<input type="text" class="form-control date-input" name="startdate" size="11" maxlength="10" ng-model="endDateStr" onchange="dataChanged()">
					<span class="input-group-btn"><button title="" type="button" class="btn btn-primary"><span class="glyphicon glyphicon-calendar"></span> </button></span>
				</div>
				<p ng-show="!endDateStr" class="help-block">Обязательное поле</p>
			</div>
			<div class="form-group">
				<label for="status" class="control-label">Статус</label>
				<select class="form-control" name="status" style="display: inline-block;" ng-model="certif.status">
					<option value="NonActual">Неактуальный</option>
					<option value="Actual">Актуальный</option>
				</select>
			</div>
		</form>
	</div>

	<div class="modal-footer">
		<button class="btn btn-primary" ng-if="!certif.id" ng-click="set()" ng-disabled="!educCertifForm.$valid || !certif.startDate || !endDateStr || !certif.studentId">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-plus-sign"></span>
			<span>Создать</span>
		</button>

		<button ng-if="certif.id" class="btn btn-primary" ng-click="set()" ng-disabled="!educCertifForm.$valid || !certif.startDate || !endDateStr">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-floppy-save"></span>
			<span>Сохранить</span>
		</button>

		<button class="btn btn-default" ng-click="cancel()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-ban-circle"></span>
			Отмена
		</button>
	</div>
</div>
