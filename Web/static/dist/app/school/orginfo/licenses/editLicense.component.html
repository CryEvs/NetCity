<ns-modal controller="$ctrl" header="{{$ctrl.header}}" buttons="$ctrl.buttons">
	<form class="form-horizontal form-xs form-edit" name="$ctrl.form">
		<div class="form-group" ng-class="{'has-error': $ctrl.form.licenseType.$invalid && (!$ctrl.form.licenseType.$pristine || $ctrl.form.$displayErrors)}">
			<label class="control-label col-md-4 col-xs-4 col-lg-4">{{$ctrl.language.Generic.SchoolInfo.kDocumentType}}</label>
			<div class="col-lg-8 col-md-8 col-xs-8">
				<select class="form-control" name="licenseType" ng-model="$ctrl.license.licenseType" required ng-options="t.id as t.name for t in $ctrl.licenseTypes" ng-disabled="$ctrl.editMode"></select>
				<p ng-show="$ctrl.form.licenseType.$invalid && (!$ctrl.form.licenseType.$pristine || $ctrl.form.$displayErrors)" class="help-block">
					Выберите тип документа
				</p>
			</div>
		</div>
		<hr />
		<license license="$ctrl.license" on-change="$ctrl.onFileChange($ctrl.modalCtx)"></license>
	</form>
</ns-modal>
