<ns-modal controller="$ctrl" header="{{$ctrl.header}}" buttons="$ctrl.buttons">
    <form class="form form-xs" name="$ctrl.linkForm">
        <ns-form control-size="col-xs-9" label-size="col-xs-3" class="form">
            <div class="form-group" ng-class="{'has-error': $ctrl.linkForm.url.$invalid && (!$ctrl.linkForm.url.$pristine || $ctrl.linkForm.$displayErrors)}">
                <label for="link-url" class="control-label">Url</label>
                <div>
                    <input track-changes type="url" name="url" id="link-url" class="form-control" ng-model="$ctrl.data.link.url" required maxlength="200">
                    <p ng-show="$ctrl.linkForm.url.$invalid && (!$ctrl.linkForm.url.$pristine || $ctrl.linkForm.$displayErrors)" class="help-block">Необходимо указать корректный url</p>
                </div>
            </div>

            <div class="form-group">
                <label for="link-description" class="control-label">Описание</label>
                <div>
                    <textarea track-changes id="link-description" class="form-control" ng-model="$ctrl.data.link.description" maxlength="200"></textarea>
				</div>
            </div>
        </ns-form>
    </form>
</ns-modal>
