<div class="day" day-number="{{$ctrl.diaryDay.number}}">
	<div class="day_table">
		<table class="day_name_mobile visible-mobile up">
			<tr>
				<td><i class="left mdi mdi-chevron-up"></i><span>{{$ctrl.diaryDay.shortTitle}}</span><i class="right mdi mdi-chevron-up"></i></td>
			</tr>
		</table>
		<table>
			<tbody>
			<tr>
				<td rowspan="{{$ctrl.diaryDay.lessons.length + 1}}" class="day_name hidden-mobile day_name">
					<span>{{$ctrl.diaryDay.title}}</span>
				</td>
				<td class="subject hidden-mobile" colspan="2">Урок</td>
				<td class="homework hidden-mobile">Домашнее задание</td>
				<td class="level hidden-mobile">Оценка</td>
			</tr>
			<tr ng-repeat-end ng-repeat="lesson in $ctrl.diaryDay.lessons" ng-class="{'hidden-xs': !lesson.subjectName}">
				<td class="num_subject" ng-class="{'videolink_container': lesson.isDistanceLesson}">
					<i class="icon-puzzle-piece" ng-if="lesson.isEaLesson"></i>
					{{lesson.number}}
					<a href="" class="videolink_3" ng-if="lesson.isDistanceLesson" ng-click="$ctrl.enterDistanceLesson(lesson)"></a>
					<div class="videolink_notification" ng-if="lesson.isDistanceLesson">Открыть окно дистанционного урока</div>
				</td>
				<td>
					<a class="subject" ng-if="lesson.subjectName" title="{{lesson.subjectName}}">{{lesson.subjectName}}</a>
					<!--<a href="javascript: void(0)" ng-click="$ctrl.enterDistanceLesson(lesson)" ng-if="lesson.isDistanceLesson">Войти</a>-->
					<div class="time" ng-if="lesson.subjectName">{{lesson.time}}
						<span ng-if="lesson.room">, {{lesson.room}}</span>
					</div>
					<div class="visible-mobile wrapper_three_dots" ng-if="lesson.homeAssignments.length">
						<input class="input_dots" type="checkbox"  />
						<div class="three_dots">
							<a href="javascript:void(0)" ng-click="$ctrl.showAssignInfo(assign)" ng-repeat="assign in lesson.homeAssignments">{{assign.assignmentName}}</a>
						</div>
						<label title="показать/свернуть все содержимое таблицы" class="icon_dots" ></label>
						
						<div class="attachments">
							<student-answer lesson="lesson" ng-if="lesson.homeAssignments.length" student-id="$ctrl.studentId" readonly="!$ctrl.isStudent"></student-answer>
							<assign-attachments lesson="lesson" ng-if="lesson.attachments && lesson.attachments.length"></assign-attachments>
						</div>
					</div>
				</td>
				<td class="hidden-mobile wrapper_three_dots">

					<input class="input_dots" type="checkbox"  />
					<div class="three_dots">
						<a href="javascript:void(0)" ng-click="$ctrl.showAssignInfo(assign)" ng-repeat="assign in lesson.homeAssignments">{{assign.assignmentName}}</a>
					</div>
					<label title="показать/свернуть все содержимое таблицы" class="icon_dots" ></label>

					<div class="attachments">
						<student-answer lesson="lesson" ng-if="lesson.homeAssignments.length" student-id="$ctrl.studentId" readonly="!$ctrl.isStudent"></student-answer>
						<assign-attachments lesson="lesson" ng-if="lesson.attachments && lesson.attachments.length"></assign-attachments>
					</div>
				</td>
				<td ng-class="{'comments_icon-show': lesson.hasComments()}">
					<assign-comments lesson="lesson"></assign-comments>
					
					<div class="level_data one two three four five mark">
						<a href="javascript:void(0)" ng-if="$ctrl.imageMarks"
							ng-repeat="assignWithMark in lesson.assignmentsWithMarks"
							ng-click="$ctrl.showAssignInfo(assignWithMark)"
							ng-class="{one: assignWithMark.mark.mark == 1, two: assignWithMark.mark.mark == 2, three: assignWithMark.mark.mark == 3, four: assignWithMark.mark.mark == 4, five: assignWithMark.mark.mark == 5, mark: assignWithMark.mark.dutyMark}"
							title="{{assignWithMark.typeName}}">
						</a>
						<a href="javascript:void(0)" ng-if="!$ctrl.imageMarks"
							ng-repeat="assignWithMark in lesson.assignmentsWithMarks"
							ng-click="$ctrl.showAssignInfo(assignWithMark)"
							title="{{assignWithMark.typeName}}">
							<span ng-if="!assignWithMark.mark.dutyMark">{{assignWithMark.mark.mark}}</span>
							<span ng-if="assignWithMark.mark.dutyMark" style="color: red; font-size: 18px;"><b>&#183;</b></span>
						</a>
					</div>
				</td>
			</tr>

			</tbody>
		</table>
	</div>
</div>
