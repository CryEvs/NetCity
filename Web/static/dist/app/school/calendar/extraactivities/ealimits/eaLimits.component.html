<style>
	table.table-sm td.input-cell > input{
		border: 0px solid #c5c5c5 !important;
	}
	.table.table-sm td.has-error > input{
		border: 1px solid #a94442 !important;
	}
</style>
		
<!-- Нагрузки для Внеурочной деятельности -->

<div>
	<form name="LimitsForm">

		<div class="row" ng-if="!state.readOnly">
			<div class="col-md-8">
				<div class="buttons-panel">
					<button title="{{$ctrl.language.Generic.Common.kSave}}" type="button" class="btn btn-primary" ng-click="$ctrl.save(LimitsForm.$valid)">
						<span class="glyphicon glyphicon-floppy-save"></span> <span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
					</button>
					<button title="{{$ctrl.language.Generic.Common.kReset}}" type="button" class="btn btn-warning" ng-click="$ctrl.reset()">
						<span class="glyphicon glyphicon-repeat"></span> <span>{{$ctrl.language.Generic.Buttons.kReset}}</span>
					</button>
				</div>
			</div>
		</div>

		<div class="row">
			<div class="col-md-8">
				<table class="table table-bordered table-sm table-condensed">
					<tbody>
						<tr>
							<th colspan="{{$ctrl.limits.length}}">
								{{$ctrl.language.SetupSchoolCalendar.kGradesHours}}
							</th>
						</tr>
						<tr>
							<th ng-repeat="info in $ctrl.limits">
								{{info.grade}}
							</th>
						</tr>
						<tr>
							<td ng-repeat="info in $ctrl.limits" ng-if="$ctrl.state.readOnly">
								{{info.hours}}
							</td>
							<td ng-repeat="info in $ctrl.limits" class="input-cell" ng-class="{ 'has-error': HoursForm.Hours.$error.minmax }" ng-if="!$ctrl.state.readOnly" ng-form name="HoursForm">
								<input track-changes numeric-input="{ negative: false, fractional: true, allownull: true }"
									name="Hours" type="text" ng-model="info.hours" maxlength="5" size="2" min="0" max="99.99" step="0.01">
							</td>
						</tr>
					</tbody>
				</table>
				<div class="alert alert-danger" ng-show="LimitsForm.$invalid">
					Введите число от 0 до 99.99
				</div>
			</div>
		</div>

	</form>
</div>
