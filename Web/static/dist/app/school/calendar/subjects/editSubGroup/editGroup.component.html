<ns-modal controller="$ctrl" header="{{$ctrl.header}}" buttons="$ctrl.buttons">
	<form role="form" name="editSubjectFieldForm" class="form-horizontal form-sm">

		<div class="form-group ">
			<label for="itemName" class="col-sm-4 control-label">{{$ctrl.language.Generic.SetupSchool.kFullName}}</label>
			<div class="col-sm-8">
				<input track-changes id="itemName" name="itemName" type="text" ng-model="$ctrl.group.name" class="form-control" maxlength="50">
			</div>
		</div>

		<div class="form-group ">
			<label for="itemShortName" class="col-sm-4 control-label">{{$ctrl.language.Generic.SetupSchoolCalendar.kAbbrName}}</label>
			<div class="col-sm-8">
				<input track-changes id="itemShortName" name="itemShortName" type="text" ng-model="$ctrl.group.shortName" class="form-control" maxlength="50">
			</div>
		</div>
	</form>
</ns-modal>
