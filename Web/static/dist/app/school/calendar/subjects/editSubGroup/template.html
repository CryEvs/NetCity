<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-header">
			<div class="bootstrap-dialog-title">
				<h4 class="modal-title" ng-bind="header"></h4>
			</div>
			<div class="bootstrap-dialog-close-button">
				<button class="close" ng-click="cancel()">×</button>
			</div>
		</div>
	</div>

	<div class="modal-body">
		<form role="form" name="editSubjectFieldForm" class="form-horizontal form-sm">
			<!--Поля формы-->

			<div class="form-group ">
				<label for="itemName" class="col-sm-4 control-label">{{language.Generic.SetupSchool.kFullName}}</label>
				<div class="col-sm-8">
					<input track-changes id="itemName" name="itemName" type="text" ng-model="group.name" class="form-control" maxlength="50">
				</div>
			</div>

			<div class="form-group ">
				<label for="itemShortName" class="col-sm-4 control-label">{{language.Generic.SetupSchoolCalendar.kAbbrName}}</label>
				<div class="col-sm-8">
					<input track-changes id="itemShortName" name="itemShortName" type="text" ng-model="group.shortName" class="form-control" maxlength="50">
				</div>
			</div>
		</form>
	</div>
	<div class="modal-footer">
		<button class="btn btn-primary" ng-click="ok()" ng-if="mode == 'create'">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-plus-sign"></span>
			<span>{{language.Generic.Buttons.kSave}}</span>
		</button>

		<button class="btn btn-primary" ng-click="ok()" ng-if="mode == 'edit'">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-plus-sign"></span>
			<span>{{language.Generic.Buttons.kSave}}</span>
		</button>

		<button class="btn btn-default" ng-click="cancel()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-ban-circle"></span>
			<span>{{language.Generic.Buttons.kCancel}}</span>
		</button>
	</div>
</div>
