<ns-modal controller="$ctrl" header="{{$ctrl.header}}" buttons="$ctrl.buttons">
	<div style="max-height: 500px; overflow-y: auto;">    
		<div class="checkbox" ng-repeat="staff in $ctrl.staffList">  
			<label>   
				<input track-changes type="checkbox" name="subjectteacher" ng-checked="$ctrl.checked(staff)" ng-click="$ctrl.toggle(staff)" ng-disabled="$ctrl.disabled(staff)">  {{staff.name}}
			</label>
		</div>
	</div>
</ns-modal>
