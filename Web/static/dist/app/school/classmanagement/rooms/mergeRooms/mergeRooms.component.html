<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-header">
			<div class="bootstrap-dialog-close-button">
				<button class="close" ng-click="$ctrl.cancel()">&times;</button>
			</div>
			<div class="bootstrap-dialog-title">
				<h4 class="modal-title" ng-bind="$ctrl.header"></h4>
			</div>
		</div>
	</div>

	<div class="modal-body">

		<form class="form-horizontal">
			<div class="form-group">
				<label class="control-label col-md-4">{{$ctrl.language.Common.kRoom}}</label>
				<div class="col-md-8">
					<select class="form-control" name="MERGEROOMID" ng-options="room.id as room.roomname for room in $ctrl.data.rooms" ng-model="$ctrl.data.mergeRoomId">
					</select>
				</div>
			</div>
			<div>{{$ctrl.language.Generic.SetupSchool.kReplaceTo}}</div>
			<div class="form-group">
				<label class="control-label col-md-4">{{$ctrl.language.Common.kRoom}}</label>
				<div class="col-md-8">
					<select class="form-control" name="ROOMID" ng-options="room.id as room.roomname for room in $ctrl.data.rooms" ng-model="$ctrl.data.roomId">
					</select>
				</div>
			</div>
		</form>

	</div>
	<div class="modal-footer">
		<button class="btn btn-primary ng-binding" ng-click="$ctrl.merge()">
			{{$ctrl.language.Generic.SetupSchool.kReplace}}
		</button>

		<button class="btn btn-default ng-binding" ng-click="$ctrl.cancel()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-remove-sign"></span>
			{{$ctrl.language.Generic.Buttons.kCancel}}
		</button>
	</div>
</div>
