
<div class="row">
	<div class="col-md-8">
		<form name="Reports">
			<div class="buttons-filters-panel form-horizontal">
				<filter-panel class="filters-panel" ng-if="ctrl.filterPanelSettings" fp="ctrl.filterPanel" fp-settings="ctrl.filterPanelSettings"></filter-panel>
			</div>
		</form>

	</div>
	<div class="col-md-4">
		<div class="buttons-panel no-actions">
			<div class="buttons-panel-right" style="display: block;">
				<button title="{{ctrl.language.Generic.Reports.kDelFromFavoriteReport}}" type="button" class="btn btn-warning" ng-if="ctrl.withFavorite && ctrl.isFavorite" ng-click="ctrl.removeFromFavorites()">
					<span class="glyphicon glyphicon-star"></span>
					<span>{{ctrl.language.Generic.Reports.kDelFromFavoriteReport}}</span>
				</button>
				<button title="{{ctrl.language.Generic.Reports.kAddFromFavoriteReport}}" type="button" class="btn btn-info" ng-if="ctrl.withFavorite && !ctrl.isFavorite" ng-click="ctrl.addToFavorites()">
					<span class="glyphicon glyphicon-star-empty"></span>
					<span>{{ctrl.language.Generic.Reports.kAddFromFavoriteReport}}</span>
				</button>
			</div>
		</div>
	</div>
</div>
<hr>
<div class="row ns-cloak">
	<div class="col-md-12">

		<div class="buttons-panel" id="buttonPanel">

			<div class="buttons-panel-left" ng-if="!ctrl.emptyChoice">
				<button title="{{ctrl.language.Generic.Buttons.kGenerate}}" type="button" class="btn btn-default" ng-click="ctrl.generate()">
					<span class="glyphicon glyphicon-random"></span>
					<span>{{ctrl.language.Generic.Buttons.kGenerate}}</span>
				</button>
				<button title="{{ctrl.language.Generic.Buttons.kGenerate}} PDF" type="button" class="btn btn-default" ng-click="ctrl.generatePdf()" ng-if="ctrl.options.pdf">
					<span class="glyphicon glyphicon-random"></span> 
					<span>{{ctrl.language.Generic.Buttons.kGenerate}} PDF</span>
				</button>
				<button title="{{ctrl.language.Reports.kSendReportSelectedStudentsAndParents}}" type="button" class="btn btn-default" ng-click="ctrl.emailDelivery()" ng-if="ctrl.options.emailDelivery">
					<span class="glyphicon glyphicon-random"></span>
					<span>{{ctrl.language.Reports.kSendReportSelectedStudentsAndParents}}</span>
				</button>
			</div>

			<div class="buttons-panel-right" id="actionPanel" style="display: block;" ng-if="ctrl.state.generated">
				<button title="{{ctrl.language.Generic.Buttons.kPrint}}" type="button" class="btn btn-default" ng-click="ctrl.print()">
					<span class="glyphicon glyphicon-print"></span>
					<span>{{ctrl.language.Generic.Buttons.kPrint}}</span>
				</button>
				<button title="{{ctrl.language.Generic.Buttons.kInSeparateWindow}}" type="button" class="btn btn-default" ng-click="ctrl.popup()">
					<span class="glyphicon glyphicon-fullscreen"></span>
					<span>{{ctrl.language.Generic.Buttons.kInSeparateWindow}}</span>
				</button>

				<div class="display-inline">
					<button title="{{ctrl.language.Generic.Buttons.kExport}}" type="button" class="btn btn-default" ng-click="ctrl.export()">
						<span class="glyphicon glyphicon-export"></span>
						<span>{{ctrl.language.Generic.Common.kBtnExcel}}</span>
					</button>
					<button title="{{ctrl.language.Generic.Buttons.kViewGraphReport}}" type="button" class="btn btn-default" ng-click="ctrl.showGraph()" ng-if="ctrl.options.hasGraph">
						<span class="glyphicon glyphicon-stats"></span>
						<span>{{ctrl.language.Generic.Buttons.kViewGraphReport}}</span>
					</button>
					<button title="{{ctrl.language.Generic.Buttons.kSend}}" type="button" class="btn btn-default" ng-if="ctrl.canSend()" ng-click="ctrl.send()">
						<span class="glyphicon glyphicon-envelope"></span>
						<span>{{ctrl.language.Generic.Buttons.kSend}}</span>
					</button>
				</div>
			</div>

		</div>

	</div>
</div>
<div class="row">
	<div class="col-md-12">
		<div class="alert alert-warning" style="white-space: pre-line;" role="alert" ng-if="ctrl.state.generated && ctrl.reportHtml && ctrl.bigReportHtml">{{ctrl.language.Generic.Reports.kBigReportNotice}}</div>
		<div id="report" ng-show="ctrl.reportHtml && !ctrl.bigReportHtml" ng-bind-html="ctrl.reportHtml | trusted">

		</div>
	</div>
</div>
