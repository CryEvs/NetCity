<div class="row ns-cloak">
	<div class="col-md-12">	
		<div class="buttons-panel">	
			<div class="buttons-panel-left" ng-if="$ctrl.state.dataReady">
				<button class="btn btn-primary" type="button" ng-click="$ctrl.save()">
					<span class="glyphicon glyphicon-floppy-save"></span>
					<span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
				</button>
			</div>
		</div>	
	</div>
</div>

<div class="row ns-cloak">
	<div class="col-md-12 col-lg-8">
		<form class="form-horizontal form-sm" name="$ctrl.form" ng-if="$ctrl.state.dataReady">
			<ns-form control-size="col-md-8" label-size="col-md-4">

				<ns-form-group title="{{ 'language.Generic.Common.kSubject' | language }}">
					<select class="form-control" name="SubjectPlan" ng-model="$ctrl.subjectPlan" ng-options="subjectPlan.name for subjectPlan in $ctrl.subjectPlans track by subjectPlan.id" track-changes ng-change="$ctrl.changePlan()">
					</select>
				</ns-form-group>

				<ns-form-group title="{{ 'language.Generic.Curriculum.kByName' | language }}" ng-class="{'has-error': $ctrl.form.Unitname.$invalid}">
					<input type="text" class="form-control" unitname-input name="Unitname" size="60" maxlength="200" ng-model="$ctrl.unit.name" required track-changes>
					<div ng-messages="$ctrl.form.Unitname.$error">
						<span class="help-block" ng-message="required">Обязательное поле</span>
						<span class="help-block" ng-message="unitname">Длина поля должна быть не больше 200 символам</span>
					</div>
				</ns-form-group>
				
				<ns-form-group title="{{ 'language.Generic.Curriculum.kNUnitINPlan' | language }}">
					<select class="form-control" name="UnitNumber" ng-model="$ctrl.unit.unitNumber" ng-options="unitNumber for unitNumber in $ctrl.unitNumbers track by unitNumber" track-changes>
					</select>
				</ns-form-group>

			</ns-form>
		</form>
	</div>
</div>
