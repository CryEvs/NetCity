<div class="row ns-cloak">
	<div class="col-md-12">	
		<div class="buttons-panel">	
			<div class="buttons-panel-left" ng-if="$ctrl.state.dataReady">
				<button class="btn btn-primary" type="button" ng-click="$ctrl.save()">
					<span class="glyphicon glyphicon-floppy-save"></span>
					<span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
				</button>
			</div>
		</div>	
	</div>
</div>

<div class="row ns-cloak">
	<div class="col-md-12 col-lg-8">
		<form class="form-horizontal form-sm" name="$ctrl.form" ng-if="$ctrl.state.dataReady">
			<ns-form control-size="col-md-8" label-size="col-md-4">

				<ns-form-group title="{{$ctrl.language.Generic.Curriculum.kVariant}}">
					<select class="form-control" name="SubjectPlan" ng-model="$ctrl.subjectPlan" ng-options="subjectPlan.name for subjectPlan in $ctrl.subjectPlans track by subjectPlan.id" track-changes ng-change="$ctrl.changePlan()">
					</select>
				</ns-form-group>

				<ns-form-group title="{{$ctrl.language.Generic.Curriculum.kUnit}}">
					<select class="form-control" name="Unit" ng-model="$ctrl.unit" ng-options="unit.name for unit in $ctrl.subjectPlan.units track by unit.id" track-changes ng-change="$ctrl.changeUnit()">
					</select>
				</ns-form-group>

				<ns-form-group title="{{$ctrl.language.Generic.Curriculum.kByName}}" ng-class="{'has-error': $ctrl.form.Lessonname.$invalid}">
					<input type="text" class="form-control" lessonname-input name="Lessonname" size="60" maxlength="2000" ng-model="$ctrl.lessonName" required track-changes>
					<div ng-messages="$ctrl.form.Lessonname.$error">
						<span class="help-block" ng-message="required">Обязательное поле</span>
						<span class="help-block" ng-message="lessonname">Длина поля должна быть не больше 2000 символам</span>
					</div>
				</ns-form-group>
				
				<ns-form-group title="{{$ctrl.language.Curriculum.kNumLessonInUnit}}">
					<select class="form-control" name="LessonNumber" ng-model="$ctrl.lessonNum" ng-options="lessonNumber for lessonNumber in $ctrl.lessonNumbers track by lessonNumber" track-changes>
					</select>
				</ns-form-group>

			</ns-form>
		</form>
	</div>
</div>
