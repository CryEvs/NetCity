<div class="row ns-cloak">
	<div class="col-md-12 buttons-filters-panel form-horizontal single-row ">

		<filter-panel ng-if="$ctrl.filterPanelSettings" fp="$ctrl.filterPanel" fp-settings="$ctrl.filterPanelSettings"></filter-panel>

	</div>
</div>


<div class="row ns-cloak">
	<div class="col-md-12">
		<div class="buttons-panel extra" ng-if="$ctrl.subjectGroupRow.length && $ctrl.subjectPlans.length">
			<div class="buttons-panel-left" ng-if="!$ctrl.readOnly">
				<button type="button" class="btn btn-primary" ng-click="$ctrl.save()">
					<span class="glyphicon glyphicon-floppy-save"></span>
					<span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
				</button>
	
				<button type="button" class="btn btn-info" ng-click="$ctrl.load()">
					<span class="glyphicon glyphicon-repeat"></span>
					<span>{{$ctrl.language.Generic.Buttons.kReset}}</span>
				</button>
			</div>
		</div>
	</div>
</div>

<div class="row ns-cloak" ng-if="!$ctrl.subjectPlans.length">
	<div class="col-md-12">
		<div class="alert alert-info" role="alert">{{$ctrl.language.Generic.Assignment.kNoKTPVariants}}</div>
	</div>
</div>

<div class="row ns-cloak" ng-if="!$ctrl.subjectGroupRow.length">
	<div class="col-md-12">
		<div class="alert alert-info" role="alert">{{'language.Curriculum.kEmptyClassSubjectGroupList' | language}}</div>
	</div>
</div>

<div class="row ns-cloak" ng-if="$ctrl.subjectGroupRow.length && $ctrl.subjectPlans.length">
	<div class="col-md-12">
		<table class="table table-xs table-print table-bordered table-thin">
			<tr>
				<th>Вариант</th>
				<th ng-repeat="assign in $ctrl.subjectGroupRow">{{assign.sg.name}}</th>
			</tr>

			<tr ng-repeat="subjectPlan in $ctrl.subjectPlans">
				<td>
					{{subjectPlan.name}}
				</td>
				<td ng-repeat="sg in $ctrl.subjectGroupRow" class="text-center bg-warning">
					<input ng-if="!sg.hours" track-changes type="radio" ng-value="subjectPlan.id" ng-model="sg.subjectPlanId" ng-disabled="sg.lessonMapsExists" data-ng-attr-title="{{sg.lessonMapsExists ? 'Вариант уже используется для создания ТКУ': ''}}">
					<div ng-if="sg.hours">
						<span ng-if="sg.subjectPlanId == subjectPlan.id">{{sg.hours}} {{'language.Generic.Curriculum.kHoursS' | language}}</span>
					</div>
				</td>
			</tr>

			<tr>
				<th>
					{{$ctrl.language.Generic.Common.kNotChoosen}}
				</th>
				<th class="text-center" ng-repeat="sg in $ctrl.subjectGroupRow">
					<input track-changes type="radio" ng-value="0" ng-model="sg.subjectPlanId" ng-if="!sg.hours && !sg.lessonMapsExists">
				</th>
			</tr>
		</table>
	</div>
</div>
