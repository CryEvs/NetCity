<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-header">
			<div class="bootstrap-dialog-title">
				<h4 class="modal-title" ng-bind="header"></h4>
			</div>
		</div>
	</div>

	<div class="modal-body">
		<form role="form" name="editGiaPersonForm" class="form-horizontal form-sm">
			<!--Поля формы-->

			<div class="form-group">
				<label for="class-select" class="control-label col-md-4 col-lg-3 col-sm-4">{{language.Common.kClass}}</label>
				<div class="col-md-8 col-lg-9 col-sm-8">
					<select id="class-select" class="form-control" ng-options="cls as cls.name for cls in data.classes track by cls.id" ng-model="data.personRelation.class" ng-change="loadStudentsByClass()"></select>
				</div>
			</div>
			
			<div class="form-group">
				<label for="student-select" class="control-label col-md-4 col-lg-3 col-sm-4">Ученик</label>
				<div class="col-md-8 col-lg-9 col-sm-8">
					<select  id="student-select" class="form-control" ng-options="student as student.name for student in data.students track by student.id" ng-model="data.personRelation.student"></select>
				</div>
			</div>

		</form>

	</div>
	<div class="modal-footer">
		<button class="btn btn-primary ng-binding" ng-click="save()" ng-disabled="data.personRelation.student.id <= 0">
			Сохранить
		</button>
		
		<button class="btn btn-danger ng-binding" ng-click="delete()" ng-if="data.edit">
			Удалить
		</button>

		<button class="btn btn-default ng-binding" ng-click="cancel()">
			Отмена
		</button>
	</div>
</div>
