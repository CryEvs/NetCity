<div class="table-responsive" style="max-height: 600px">
	<table class="table table-bordered table-bright-hover table-bright-striped table-xs print-block">
		<tr>
			<th {{commonTitlesRowspan}}> <input type="CHECKBOX" onchange="moveStudentsListCtrl.selectAllSelectedUsers(this.checked)"></th>
			<th {{commonTitlesRowspan}}> {{{language.Generic.Filter.kN_PP}}}</th>
			<th {{commonTitlesRowspan}}> {{{language.Generic.Filter.kFIO}}}</th>
			<th {{commonTitlesRowspan}}> {{{language.Generic.Common.kBDate}}}</th>
		</tr>
		{{#each checkedMovements}}
		<tr>
			<td class="text-center">
				<input type="CHECKBOX" name="SelStudents" value="{{movementId}}" id="movementSel-{{movementId}}">
			</td>
			<td>
				{{Inc @index 1 0}}
			</td>
			<td>
				<label for="movementSel-{{movementId}}" class="fio-label">{{FIO studentInfo}}</label>
			</td>
			<td>
				{{DateOnly2str studentInfo.birthDate}}
			</td>
		</tr>
		{{/each}}
	</table>
</div>
