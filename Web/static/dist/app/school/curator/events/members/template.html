<h3 class="first">Информация о мероприятии</h3>
<div ng-include="'/static/dist/app/em/events/common/memberList/eventInfoTemplate.html'"></div>

<hr />

<h3 class="first">Список участников</h3>

<div class="row">
	<div class="col-md-4">
		<form class="form-horizontal form-sm">

			<div class="form-group">
				<label class="control-label col-md-4 col-lg-3 col-sm-4">Вид</label>
				<div class="col-md-8 col-lg-9 col-sm-8">
					<select storage class="form-control" ng-options="viewType.id as viewType.title for viewType in filter.items.viewType" ng-change="filterMembers()" ng-model="filter.selected.viewType"></select>
				</div>
			</div>

			<div class="form-group">
				<label class="control-label col-md-4 col-lg-3 col-sm-4">Итог участия</label>
				<div class="col-md-8 col-lg-9 col-sm-8">
					<select storage class="form-control" ng-options="title.id as title.name for title in filter.items.eventMemberTitles" ng-change="filterMembers()" ng-model="filter.selected.eventMemberTitle"></select>
				</div>
			</div>

		</form>
	</div>
</div>

<div class="row" ng-if="!state.emptyData">
	<div class="col-md-12">
		<div class="buttons-panel">

			<button type="button" title="Добавить в участники подопечного" class="btn btn-info" ng-click="addMember()">
				<span class="glyphicon glyphicon-plus-sign"></span>
				<span>{{language.Generic.Buttons.kAdd}}</span>
			</button>

			<button type="button" class="btn btn-info" ng-click="editMember(data.selection.selected)" ng-disabled="!data.selection.selected || !isCuratorStudent(data.selection.selected)">
				<span class="glyphicon glyphicon-pencil"></span>
				<span>{{language.Generic.Buttons.kEdit}}</span>
			</button>

			<button type="button" class="btn btn-info" ng-click="removeMember(data.selection.selected)" ng-disabled="!data.selection.selected || !isCuratorStudent(data.selection.selected)">
				<span class="glyphicon glyphicon-minus-sign"></span>
				<span>{{language.Generic.Buttons.kRemove}}</span>
			</button>

		</div>
	</div>
</div>

<div class="row">
	<div class="col-md-12">
		<event-members-component members="data.members" view-members="data.viewMembers" selection="data.selection"></event-members-component>
	</div>
</div>
