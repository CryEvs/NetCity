<div class="buttons-filters-panel form-horizontal ns-clock">
	<div class="row">
		<div class="col-md-6 col-lg-6 col-sm-12">
			<div class="form-group">
				<label class="control-label col-md-4 col-lg-3 col-sm-4">Предмет</label>
				<div class="col-md-8 col-lg-5 col-sm-8">
					<span class="form-control form-control-title">
						<span class="text">{{$ctrl.subjectGroup.name}}</span>
					</span>
				</div>
			</div>
		</div>
	</div>
	<div class="row">
		<div class="col-md-12">
			<div class="buttons-panel">
				<div class="buttons-panel-left">
					<button title="Сохранить изменения" type="button" class="btn btn-primary" ng-click="$ctrl.save()">
						<span class="glyphicon glyphicon-floppy-save"></span>
						<span>Сохранить</span>
					</button>
					<button title="Восстановить значения" type="button" class="btn btn-warning" ng-click="$ctrl.reset()">
						<span class="glyphicon glyphicon-repeat"></span>
						<span>Восстановить</span>
					</button>
				</div>
			</div>
		</div>
	</div>
</div>

<div class="row ns-clock">
	<div class="col-md-6">
		<div class="alert alert-info" role="alert" ng-if="$ctrl.examTypes.length == 0">
			{{$ctrl.language.Generic.Grade.kEmptyExamTypes}}
		</div>
		<table class="table table-bordered">
			<tr>
				<th>Типы экзаменов</th>
				<th>Использовать</th>
				<th>По выбору</th>
			</tr>
			<tr ng-repeat="periodType in $ctrl.examTypes">
				<td>{{periodType.title}}</td>
				<td class="text-center">
					<span ng-if="$ctrl.isExamUsing(periodType)">{{$ctrl.language.Generic.Common.kEmploy}}</span>
					<input type="checkbox" ng-if="!$ctrl.isExamUsing(periodType)" ng-checked="$ctrl.selection.isSelected(periodType)" ng-click="$ctrl.setSelection(periodType)">
				</td>
				<td class="text-center">
					<input type="checkbox" ng-attr-title="{{$ctrl.isChoiceSelectionDisabled(periodType) ? $ctrl.language.Generic.Grade.kChoiceWithoutUsed : ''}}" ng-checked="$ctrl.choiceSelection.isSelected(periodType)" ng-disabled="$ctrl.isChoiceSelectionDisabled(periodType)" ng-click="$ctrl.choiceSelection.select(periodType)">
				</td>
			</tr>
		</table>
	</div>
</div>
