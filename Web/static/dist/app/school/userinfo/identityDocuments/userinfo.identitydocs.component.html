<div ng-repeat="identityDocument in $ctrl.identityDocuments" class="form-group">
	<div class="visible-xs-block visible-sm-block text-center">
		<label class="control-label col-md-3 col-lg-3">
			{{identityDocument.docTypeInfo}}
		</label>
		<div ng-if="!$ctrl.readOnlyAll">
			<button title="{{$ctrl.language.Generic.Buttons.kEdit}}" type="button" name="edit-button" ng-click="$ctrl.editIdentityDocument(identityDocument.id)" class="btn btn-sm btn-warning">
				<span class="glyphicon glyphicon-pencil"></span>
			</button>
			<button title="{{$ctrl.language.Generic.Buttons.kRemove}}" type="button" name="remove-button" ng-click="$ctrl.delIdentityDocument(identityDocument.id)" class="btn btn-sm btn-danger">
				<span class="glyphicon glyphicon-minus-sign"></span>
			</button>
		</div>
	</div>
	<div class="control-label hidden-xs hidden-sm col-md-3 col-lg-3">
		<label>{{identityDocument.docTypeInfo}}</label>
		<div ng-if="!$ctrl.readOnlyAll">
			<button ng-disabled="$ctrl.editProcessing" title="{{$ctrl.language.Generic.Buttons.kEdit}}" type="button" ng-click="$ctrl.editIdentityDocument(identityDocument.id)" name="edit-button" class="btn btn-sm btn-warning">
				<span class="glyphicon glyphicon-pencil"></span>
			</button>
			<button ng-disabled="$ctrl.delProcessing" title="{{$ctrl.language.Generic.Buttons.kRemove}}" type="button" ng-click="$ctrl.delIdentityDocument(identityDocument.id)" name="remove-button" class="btn btn-sm btn-danger">
				<span class="glyphicon glyphicon-minus-sign"></span>
			</button>
		</div>
	</div>
	<div class="col-md-8 col-lg-8">
		<div class="row">
			<identity-document identity-document-types="$ctrl.identityDocumentTypes" identity-document="identityDocument" readonly="true" edit-mode="false" edit-flag="$ctrl.editFlag" add-flag="$ctrl.addFlag"></identity-document>
		</div>
	</div>
</div>

<div ng-if="!$ctrl.identityDocuments.length" class="alert alert-info" role="alert">
	Нет данных
</div>

<div ng-if="!$ctrl.readOnlyAll" class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
	<button ng-disabled="$ctrl.addProcessing" ng-click="$ctrl.addIdentityDocument()" title="{{$ctrl.language.Generic.Buttons.kAdd}}" name="add-button" type="button" class="btn btn-sm btn-info">
		<span class="glyphicon glyphicon-plus-sign"></span>
		<span>{{$ctrl.language.Generic.Buttons.kAdd}}</span>
	</button>
</div>
