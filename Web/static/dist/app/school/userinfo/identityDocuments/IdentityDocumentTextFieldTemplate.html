{{#CheckField docTypeFields docTypeFieldCode}}

{{#if ../editMode}}
	<div class="form-group field-row-{{../../id}}">
		<label class="control-label col-md-4 col-xs-4 col-lg-4">{{{../../title}}}</label>
		<div class="col-lg-8 col-md-8 col-xs-8">
			<input class="form-control field-input-{{../../id}}" name="{{../../id}}" size="{{size}}" maxlength="{{../../maxLength}}" value="{{../../fieldValue}}" {{#if ../../readonly}} disabled {{/if}} type="text">
		</div>
	</div>
{{else}}
	<div class="col-md-{{../../colsize}}">
		<label>{{{../../title}}}</label>
		<input class="form-control field-input-{{../../id}}" name="{{../../id}}" size="{{../../size}}" maxlength="{{../../maxLength}}" value="{{../../fieldValue}}" {{#if ../../readonly}} disabled {{/if}} type="text">
	</div>
{{/if}}

{{/CheckField}}
