<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-title">
			<h4 class="modal-title">{{$ctrl.header}}</h4>
		</div>
		<div class="bootstrap-dialog-close-button">
			<button class="close" ng-click="$ctrl.cancel()">×</button>
		</div>
	</div>

	<div class="modal-body">

		<form class="form-horizontal form-xs">
			<div class="form-group">
				<label class="control-label col-md-5">Тип родства</label>
				<div class="col-md-7">
					<label class="radio-inline" ng-repeat="type in $ctrl.memberTypes">
						<input type="radio" name="MemberTypeRadio" ng-model="$ctrl.memberTypeExt" ng-value="type"> <span>{{type.name}}</span>
					</label>
				</div>
			</div>
			<div class="form-group">
				<label class="control-label col-md-5">{{$ctrl.language.Generic.Common.kLastName}}</label>
				<div class="col-md-7">
					<input type="text" class="form-control" name="LastName" size="50" maxlength="100" ng-model="$ctrl.familyMember.lastName" ng-disabled="$ctrl.familyMember.userId">
				</div>
			</div>
			<div class="form-group">
				<label class="control-label col-md-5">{{$ctrl.language.Generic.Common.kFirstName}}</label>
				<div class="col-md-7">
					<input type="text" class="form-control" name="FirstName" size="50" maxlength="100" ng-model="$ctrl.familyMember.firstName" ng-disabled="$ctrl.familyMember.userId">
				</div>
			</div>
			<div class="form-group">
				<label class="control-label col-md-5">{{$ctrl.language.Generic.Common.kMiddleName}}</label>
				<div class="col-md-7">
					<input type="text" class="form-control" name="MiddleName" size="50" maxlength="100" ng-model="$ctrl.familyMember.middleName" ng-disabled="$ctrl.familyMember.userId">
				</div>
			</div>
			<div class="form-group">
				<fieldset ng-disabled="$ctrl.familyMember.userId">
					<label class="control-label col-md-5">{{$ctrl.language.Generic.Reports.kBirthdate}}</label>
					<div class="col-md-7">
						<edit-date-input date="$ctrl.familyMember.birthDate" track-changes></edit-date-input>
					</div>
				</fieldset>
			</div>
			<div class="form-group">
				<fieldset ng-disabled="$ctrl.familyMember.userId">
					<label class="control-label col-md-5">{{$ctrl.language.Generic.Common.kGender}}</label>
					<div class="col-md-7">
						<label class="radio-inline">
							<input type="radio" name="GenderRadio" ng-change="$ctrl.genderChanged()" ng-model="$ctrl.familyMember.gender" ng-value="'Male'"> <span>{{$ctrl.language.Generic.Common.kMale}}</span>
						</label>
						<label class="radio-inline">
							<input type="radio" name="GenderRadio" ng-change="$ctrl.genderChanged()" ng-model="$ctrl.familyMember.gender" ng-value="'Female'"> <span>{{$ctrl.language.Generic.Common.kFemale}}</span>
						</label>
					</div>
				</fieldset>
			</div>
			<div class="form-group" ng-if="$ctrl.isChild()">
				<fieldset>
					<label class="control-label col-md-5">{{$ctrl.language.Generic.Reports.kEmployment}}</label>
					<div class="col-md-7">
						<input ng-disabled="$ctrl.familyMember.userId" type="text" class="form-control" name="Employment" size="400" maxlength="400" ng-model="$ctrl.familyMember.employment" track-changes>
					</div>
				</fieldset>
			</div>

		</form>
	</div>

	<div class="modal-footer">

		<button class="btn btn-default btn-sm" ng-click="$ctrl.save()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-save"></span>
			<span>{{$ctrl.language.Generic.Buttons.kSave}}</span>
		</button>

		<!-- ОТМЕНИТЬ -->
		<button class="btn btn-default btn-sm" ng-click="$ctrl.cancel()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-ban-circle"></span>
			<span>{{$ctrl.language.Generic.Buttons.kCancel}}</span>
		</button>

	</div>
</div>
