<div class="bootstrap-dialog type-primary">
	<div class="modal-header">
		<div class="bootstrap-dialog-title">
			<h4 class="modal-title">{{$ctrl.header}}</h4>
		</div>
		<div class="bootstrap-dialog-close-button">
			<button class="close" ng-click="$ctrl.cancel()">×</button>
		</div>
	</div>

	<div class="modal-body">
		<div class="alert alert-info" role="alert">
			<span>Внимание!</span><br>
			<span style="white-space: pre;">{{$ctrl.warningMessage}}</span>
		</div>
		<form class="form-horizontal form-xs">
			<table class="table table-xs table-hover table-selectable">
				<tr>
					<th>Степень родства</th>
					<th>ФИО</th>
					<th>Дата рождения</th>
				</tr>
				<tr ng-repeat="member in $ctrl.familyMembers" ng-class="{'selected': $ctrl.selection.isSelected(member)}" ng-click="$ctrl.selection.select(member)">
					<td>{{$ctrl.getRelName(member)}}</td>
					<td>{{member.lastName}} {{member.firstName}} {{member.middleName}}</td>
					<td>{{member.birthDate | nsDate}}</td>
				</tr>
			</table>
		</form>
	</div>

	<div class="modal-footer">

		<button class="btn btn-default btn-sm" ng-click="$ctrl.save()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-check"></span>
			<span>{{$ctrl.language.Generic.Buttons.kChoose}}</span>
		</button>

		<!-- ОТМЕНИТЬ -->
		<button class="btn btn-default btn-sm" ng-click="$ctrl.cancel()">
			<span class="bootstrap-dialog-button-icon glyphicon glyphicon-ban-circle"></span>
			<span>{{$ctrl.language.Generic.Buttons.kCancel}}</span>
		</button>

	</div>
</div>
