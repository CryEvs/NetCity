<ns-modal controller="$ctrl" header="{{$ctrl.language.SetupSchoolCalendar.kTitleTeacherSubjects}}" buttons="$ctrl.buttons">
	<span class="content-page-preloader" id="preloader" ng-hide="$ctrl.ready"><span>{{$ctrl.language.Generic.Movement.kPleaseWait}}</span></span>
	<div ng-show="$ctrl.ready" ng-if="$ctrl.model.length == 0" class="alert alert-info" role="alert">
		{{$ctrl.language.Generic.SetupSchoolCalendar.kNoSbjectList}}
	</div>

	<div>
		<div class="checkbox ng-scope" ng-repeat="model in $ctrl.selected.items">
			<label class="ng-binding" ng-if="model.pastUsed || ! model.used"><input track-changes type="checkbox" ng-model="model.checked" ng-disabled="model.used" ng-change="$ctrl.select(model)">{{model.name}}</label>
			<label class="ng-binding" ng-if="!model.pastUsed && model.used"><input track-changes type="checkbox" ng-model="model.checked" ng-disabled="model.used" ng-change="$ctrl.select(model)"><a href="#" ng-click="$ctrl.goToSubjectgroups(model)">{{model.name}}</a></label>
		</div>
	</div>

	<div style="max-height: 500px; overflow-y: auto;">
		<div class="checkbox ng-scope" ng-repeat="model in $ctrl.available.items">
			<label class="ng-binding"><input track-changes type="checkbox" ng-model="model.checked" ng-disabled="model.used" ng-change="$ctrl.select(model)">{{model.name}}</label>
		</div>
	</div>
</ns-modal>
