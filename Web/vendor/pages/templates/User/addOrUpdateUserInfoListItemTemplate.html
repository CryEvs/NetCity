<form name="updateParamForm" class="form-horizontal">
	<div class="form-group ">
		<label for="itemName" class="col-sm-4 control-label  ">{{language.Generic.SetupSchool.kFullName}}</label>
		<div class="col-sm-6">
			<input id="itemName" name="itemName" type="text" value="{{itemName}}" class="form-control">
		</div>
	</div>

	<div class="form-group ">
		<label for="itemShortName" class="col-sm-4 control-label  ">{{language.Generic.SetupSchool.kAbbr_Name}}</label>
		<div class="col-sm-6">
			<input id="itemShortName" name="itemShortName" type="text" value="{{itemShortName}}" class="form-control">
		</div>
	</div>
</form>
