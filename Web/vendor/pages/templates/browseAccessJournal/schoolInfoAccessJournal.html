<div style="max-height: 500px; overflow: auto;">
	<table class="table table-bordered table-bright-striped table-bright-hover table-xs">
		<tr>
			<th style="width: 30%;">{{language.Generic.Common.kDate}}</th>
			<th>{{language.Generic.Common.kAuthorOfChanges}}</th>
			<th style="width: 1%;">IP</th>
			

			{{#if hasReason}}
			<th>Основание изменения</th>
			<th>Документ</th>
			{{/if}}


			<th style="width: 1%;"></th>
		</tr>
		{{#each accessJournalEntries}}
			<tr>
				<td>{{date}}</td>
				<td>{{author}}</td>
				<td>{{ip}}</td>
				
				{{#if @root.hasReason}}
				<td>
					{{reason}}
				</td>
				<td>
					{{#if reasonDocId}}
					<span onclick='downloadFile("/webapi/attachments/{{reasonDocId}}")'><a style="cursor: pointer;">Скачать</a></span>
					{{/if}}
				</td>

				{{/if}}

				<td>
					<a class="showDetale" access-journal-id="{{id}}" title="{{language.Generic.Common.kDetails}}" style="cursor: pointer;">
						<span class="icon-th-list "></span>
					</a>
				</td>
			</tr>
		{{/each}}
	</table>
</div>
